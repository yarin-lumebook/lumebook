.lb-cube { position: relative; display: flex; flex-direction: column; gap: var(--sp-2); min-height: 10.5rem; min-width: 0; padding: var(--sp-4); border-radius: var(--r-lg); background: var(--tc-soft, var(--fill)); border: 1px solid transparent; color: var(--text); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.lb-cube:hover { transform: translateY(-2px); border-color: var(--tc, var(--line-strong)); box-shadow: 0 16px 32px -20px var(--tc, var(--text-3)); }
.lb-cube:has(.lb-cube-title:focus-visible) { outline: 2px solid var(--tc, var(--focus)); outline-offset: 3px; }
.lb-cube-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-2); }
.lb-cube-title { all: unset; color: var(--text); font-family: var(--font); font-size: var(--fs-headline); font-weight: 700; line-height: 1.25; text-wrap: balance; cursor: pointer; }
.lb-cube-title::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.lb-cube-desc { margin: 0; color: var(--text-2); font-family: var(--font-2); font-size: var(--fs-footnote); line-height: 1.4; overflow-wrap: anywhere; }
.lb-cube-foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-1) var(--sp-2); font-family: var(--font-2); font-size: var(--fs-caption); }
.lb-cube-where { display: inline-flex; align-items: center; gap: .3rem; color: var(--tc-ink, var(--text-2)); font-weight: 700; }
.lb-cube-alt { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: .25rem; padding: .15rem .55rem; border-radius: var(--r-pill); background: var(--surface); color: var(--text-2); font-weight: 600; text-decoration: none; box-shadow: var(--shadow-1); }
.lb-cube-alt:hover { color: var(--tc-ink, var(--tint)); text-decoration: none; }
.lb-cube-alt:focus-visible { outline: 2px solid var(--tc, var(--focus)); outline-offset: 2px; }
.lb-cube-where svg, .lb-cube-alt svg, .lb-drag svg, .lb-cube-add svg { width: .8rem; height: .8rem; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* editing a launcher: is-editing on lb-topics. Each topic sits on a surface with an lb-drag handle (a button with an aria-label),
   cubes get a dashed category edge and a grab cursor, and lb-cube-add ends each grid. lb-sort-ghost and lb-sort-drag are the drag
   states (SortableJS ghostClass and dragClass). */
.lb-topics.is-editing .lb-topic { padding: var(--sp-3); border-radius: var(--r-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.lb-topics.is-editing .lb-cube { cursor: grab; border: 1px dashed var(--tc, var(--line-strong)); }
.lb-topics.is-editing .lb-cube:hover { transform: none; }
.lb-drag { all: unset; display: inline-grid; place-items: center; width: 1.75rem; height: 2.25rem; border-radius: var(--r-sm); color: var(--text-3); cursor: grab; flex: none; }
.lb-drag:hover, .lb-drag:focus-visible { background: var(--fill); color: var(--text); }
.lb-drag svg { width: 1.1rem; height: 1.1rem; }
.lb-cube-add { all: unset; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-2); min-height: 10.5rem; padding: var(--sp-4); border-radius: var(--r-lg); border: 1.5px dashed var(--line-strong); color: var(--text-2); font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; cursor: pointer; }
.lb-cube-add:hover, .lb-cube-add:focus-visible { border-color: var(--tc, var(--tint)); color: var(--tc-ink, var(--tint)); background: var(--tc-soft, var(--tint-soft)); }
.lb-cube-add svg { width: 1.4rem; height: 1.4rem; }
.lb-sort-ghost { opacity: .35; }
.lb-sort-drag { box-shadow: var(--shadow-3); transform: rotate(-1.5deg); }

/* ---------- forms in a modal ----------
   lb-form: an lb-card form (usually inside lb-modal over lb-scrim) with lb-field rows, fieldsets with a plain legend, one
   lb-form-error line (role="alert") and lb-form-actions: the primary action first, cancel next, a destructive one at the far end
   behind an lb-spacer that asks once more before it acts. lb-icon-picker: a grid of icon buttons with aria-pressed and aria-label.
   lb-color-picker: round swatch buttons, each with an lb-cat-N class (lb-cat-0 is neutral ink), aria-pressed and a colour name. */
.lb-form { display: grid; gap: var(--sp-4); }
.lb-form h2 { font-size: var(--fs-title); }
.lb-form fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: var(--sp-3); min-width: 0; }
.lb-form legend { padding: 0; margin-bottom: var(--sp-2); font-weight: 700; color: var(--text); }

/* The LumeBook project nav (Yarin, 5 Nov 2026): one navigation on every internal page.
   - top bar (first layer): the logo home to HQ and HQ's topics; a topic opens its tools in the side bar
   - location path under it: HQ › topic › this page
   - side bar on the right (second layer): every HQ tool by topic; collapses to an icon rail, the menu button toggles it,
     the choice is kept in this browser
   - phones (760px and narrower): the side bar is a drawer over the page, a bottom nav bar holds HQ, the first three
     topics and "עוד"; both bars slide away while scrolling down and come back on the way up
   Source: shared/design/nav.src.js. design.py puts window.LB_NAV_DATA in front of it (hq-tools.json with the topic
   colours, the icons, the logo, the HQ and Vercel addresses, HQ's saved layout) and writes shared/design/nav.js.
   Builds inline it with design.head(); HQ and the SMM plan link a synced copy. Styles: "project nav" in lumebook.css.
   A page tells it where it is with window.LB_PAGE = { file: "<path in the project>" } (design.head() does this inside
   a lumebook.py build) or { hq: true } (HQ, which then calls LBNav.setCurrent on every view). Without it the address
   decides: the path on the project server, the address on Vercel. */
(() => {
  "use strict";
  if (window.LBNav) return;
  const D = window.LB_NAV_DATA || { topics: [], icons: {}, ui: {}, hq: {}, web_copies: {} };
  const PAGE = window.LB_PAGE || {};
  const host = location.hostname;
  const LOCALHOST = /^(localhost|127\.0\.0\.1)$/.test(host);
  const ON_SERVER = LOCALHOST && location.port === "8780";
  // where this page is open decides which version of a tool a link opens (as on HQ's cubes): the project server opens the
  // local page, the claude.ai artifact the artifact, the Vercel copy the copy or the artifact. claude.ai opens a link from
  // an artifact in a new tab and allows nothing else.
  const MODE = LOCALHOST || location.protocol === "file:" ? "local" : /\.vercel\.app$/.test(host) ? "web" : "artifact";
  const NEW_TAB = MODE === "artifact" ? ' target="_blank" rel="noopener noreferrer"' : "";
  const PHONE = window.matchMedia("(max-width: 760px)");
  const KEY = "lb-gside";

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const svg = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner || ""}</svg>`;
  const ico = (name) => svg((D.icons || {})[name] || (D.icons || {}).grid);
  const ui = (name) => svg((D.ui || {})[name]);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const localUrl = (p) => (ON_SERVER ? "/" : "http://localhost:8780/") + p.split("/").map(encodeURIComponent).join("/");
  const HQ_URL = PAGE.hq ? "" : MODE === "local" ? localUrl(D.hq.local) : MODE === "web" ? D.hq.web : D.hq.artifact;
  const hqTarget = PAGE.hq || MODE !== "artifact" ? "" : NEW_TAB;

  // ---------- the layout: hq-tools.json, then Yarin's own arrangement from HQ edit mode ----------
  const toolId = (t) => t.id || (t.view ? "v:" + t.view + (t.tab ? ":" + t.tab : "") : t.local ? "l:" + t.local : t.art ? "a:" + t.art : "w:" + (t.web || t.t));
  function defaultLayout() {
    return { v: 1, removed: [], topics: (D.topics || []).map((tp) => ({ id: tp.id, label: tp.label, desc: tp.desc || "", icon: tp.icon || "grid",
      cat: Number(tp.cat) || 0, tools: (tp.tools || []).map((t) => ({ ...clone(t), id: toolId(t) })) })) };
  }
  // a saved layout wins; a tool added to hq-tools.json later still shows up (in its topic) unless Yarin deleted it (removed)
  function mergeLayout(saved) {
    const def = defaultLayout();
    if (!saved || saved.default || !Array.isArray(saved.topics)) return def;   // default: true = reset, follow hq-tools.json
    const L = { v: 1, removed: Array.isArray(saved.removed) ? saved.removed.slice() : [],
      topics: clone(saved.topics).filter((t) => t && t.id).map((t) => ({ ...t, cat: Number(t.cat) || 0, tools: (t.tools || []).filter((x) => x && x.id) })) };
    const have = new Set(L.topics.flatMap((t) => t.tools.map((x) => x.id))), gone = new Set(L.removed);
    for (const dt of def.topics) for (const tool of dt.tools) {
      if (have.has(tool.id) || gone.has(tool.id)) continue;
      let home = L.topics.find((t) => t.id === dt.id);
      if (!home) { home = { ...dt, tools: [] }; L.topics.push(home); }
      home.tools.push(tool); have.add(tool.id);
    }
    return L;
  }

  // the version a tool opens here (main) and, when there is one, the other version (alt): HQ's cubes use the same rule
  function toolLinks(t) {
    if (t.view) return { main: { href: HQ_URL + "#" + t.view, where: "ב-HQ", kind: "view" }, alt: null };
    const copy = MODE === "web" && (D.web_copies || {})[t.art];
    const v = { local: t.local && { href: localUrl(t.local), where: "מקומי", kind: "local" },
                art: t.art && { href: "https://claude.ai/artifact/" + t.art, where: "ארטיפקט", kind: "art" },
                web: t.web && { href: t.web, where: t.webLabel || "אתר", kind: "web" },
                copy: copy && { href: copy, where: "Vercel", kind: "web" } };
    const main = (MODE === "local" ? [v.local, v.art, v.web] : [v.copy, v.art, v.web, v.local]).find(Boolean);
    if (!main) return { main: { href: HQ_URL + "#tools", where: "אין קישור עדיין", kind: "view" }, alt: null };
    if (MODE !== "local" && main.kind === "local") main.where = "מקומי בלבד";
    const alt = MODE === "local" ? (main.kind !== "art" ? v.art : null) : (main.kind !== "local" ? v.local : null);
    return { main, alt: alt ? { ...alt, label: alt.kind === "art" ? "גרסת ארטיפקט" : "גרסה מקומית" } : null };
  }

  // ---------- where this page is ----------
  const norm = (p) => String(p || "").replace(/^\/+/, "").replace(/(^|\/)index\.html?$/i, "$1");
  const sameUrl = (a, b) => { try { const x = new URL(a), y = new URL(b, a); return x.host === y.host && norm(x.pathname) === norm(y.pathname); } catch { return false; } };
  function findCurrent(L) {
    if (PAGE.hq) return S.view ? L.topics.flatMap((tp) => tp.tools.map((t) => [t, tp])).find(([t]) => t.view === S.view && !t.tab) || null : null;
    const here = norm(decodeURIComponent(location.pathname)), art = PAGE.file && (D.pages || {})[PAGE.file];
    for (const tp of L.topics) for (const t of tp.tools) {
      if (t.view) continue;
      if (PAGE.file && t.local && norm(PAGE.file) === norm(t.local)) return [t, tp];
      if (art && t.art === art) return [t, tp];
      if (ON_SERVER && t.local && (here === norm(t.local) || (t.local.endsWith("/") && here.startsWith(t.local)))) return [t, tp];
      if (LOCALHOST && location.port === "8777" && t.local === "hook-studio/") return [t, tp];
      if (MODE === "web" && ((t.web && sameUrl(location.href, t.web)) || (t.art && (D.web_copies || {})[t.art] && sameUrl(location.href, D.web_copies[t.art])))) return [t, tp];
    }
    return null;
  }

  // ---------- state ----------
  const S = { L: mergeLayout(D.saved), view: null, viewTitle: "", focus: "", away: false, lastY: 0, opener: null };
  const readPref = () => { try { return localStorage.getItem(KEY) === "expanded"; } catch { return false; } };
  const writePref = (on) => { try { localStorage.setItem(KEY, on ? "expanded" : "collapsed"); } catch {} };
  let expanded = readPref();   // the side bar starts as a collapsed icon rail
  const root = document.documentElement;
  const el = {};

  // ---------- markup ----------
  function topBar(cur) {
    const curTopic = cur ? cur[1].id : "";
    return `<button type="button" class="lb-gnav-toggle" data-gnav="toggle" aria-controls="lb-gside" aria-expanded="false" aria-label="כל הכלים">${ui("menu")}</button>
      <a class="lb-gnav-brand" href="${esc(HQ_URL || "#tools")}"${hqTarget} aria-label="HQ, כל הכלים"><img src="${esc(D.logo || "")}" alt="" width="28" height="28"><b>LumeBook</b></a>
      <nav class="lb-gnav-topics" aria-label="נושאים">${S.L.topics.filter((tp) => tp.tools.length).map((tp) =>
        `<button type="button" class="lb-gnav-topic lb-cat-${tp.cat}" data-gtopic="${esc(tp.id)}" aria-controls="lb-gside"${tp.id === curTopic ? ' aria-current="true"' : ""}>${ico(tp.icon)}<span>${esc(tp.label)}</span></button>`).join("")}</nav>`;
  }
  function path(cur) {
    const items = [];
    const atHome = PAGE.hq && (!S.view || S.view === "tools");
    items.push(atHome ? `<b aria-current="page">HQ</b>` : `<a href="${esc(HQ_URL || "#tools")}"${hqTarget}>HQ</a>`);
    if (cur) items.push(`<button type="button" data-gtopic="${esc(cur[1].id)}" aria-controls="lb-gside">${esc(cur[1].label)}</button>`);
    if (!atHome) {
      const name = PAGE.hq ? S.viewTitle || (cur && cur[0].t) : cur ? cur[0].t : pageTitle();
      if (name) items.push(`<b aria-current="page"${cur && cur[0].en ? ' lang="en" dir="ltr"' : ""}>${esc(name)}</b>`);
    }
    return `<nav class="lb-crumbs" aria-label="מיקום בפרויקט">${items.join("")}</nav><div class="lb-gpath-slot"></div>`;
  }
  // a page that is not one of HQ's tools shows its own title, without the "LumeBook ·" part many titles start with
  const pageTitle = () => (document.title || "").replace(/^\s*(LumeBook|לומבוק)\s*[·|:\-]\s*/i, "").trim();
  function side(cur) {
    const curId = cur ? cur[0].id : "";
    return `<div class="lb-gside-head"><b>כל הכלים</b><button type="button" class="lb-gside-close" data-gnav="close" aria-label="סגירה">${ui("close")}</button></div>
      <nav class="lb-gside-scroll" aria-label="כל הכלים">${S.L.topics.filter((tp) => tp.tools.length).map((tp) =>
        `<section class="lb-gside-topic lb-cat-${tp.cat}${tp.id === S.focus ? " is-focus" : ""}" data-gtopic-sec="${esc(tp.id)}" aria-labelledby="lb-gside-${esc(tp.id)}">
          <h2 class="lb-gside-h" id="lb-gside-${esc(tp.id)}">${esc(tp.label)}</h2>
          <ul>${tp.tools.map((t) => {
            const { main } = toolLinks(t), nt = main.kind === "view" ? "" : NEW_TAB;
            const tab = PAGE.hq && t.tab ? ` data-open-tab="${esc(t.tab)}"` : "";
            return `<li><a class="lb-gside-item" href="${esc(main.href)}"${nt}${tab} title="${esc(t.t + (t.sub ? ": " + t.sub : ""))}"${t.id === curId ? ' aria-current="page"' : ""}>`
              + `<span class="lb-tile" aria-hidden="true">${ico(t.icon)}</span><span class="lb-gside-name"${t.en ? ' lang="en" dir="ltr"' : ""}>${esc(t.t)}</span></a></li>`;
          }).join("")}</ul>
        </section>`).join("")}</nav>`;
  }
  function bottom(cur) {
    const first = S.L.topics.filter((tp) => tp.tools.length).slice(0, 3);
    const curTopic = cur ? cur[1].id : "", home = PAGE.hq && (!S.view || S.view === "tools");
    const inMore = curTopic && !first.some((tp) => tp.id === curTopic);
    return `<a class="lb-gbottom-item" href="${esc(HQ_URL || "#tools")}"${hqTarget}${home ? ' aria-current="page"' : ""}>${ico("grid")}<span>HQ</span></a>`
      + first.map((tp) => `<button type="button" class="lb-gbottom-item lb-cat-${tp.cat}" data-gtopic="${esc(tp.id)}" aria-controls="lb-gside"${tp.id === curTopic ? ' aria-current="true"' : ""}>${ico(tp.icon)}<span>${esc(tp.label)}</span></button>`).join("")
      + `<button type="button" class="lb-gbottom-item" data-gnav="more" aria-controls="lb-gside" aria-expanded="false"${inMore ? ' aria-current="true"' : ""}>${ui("menu")}<span>עוד</span></button>`;
  }

  // ---------- drawing ----------
  function mount() {
    if (el.bar || !document.body) return;

    el.path = make("div", "lb-gpath");
    el.side = make("aside", "lb-gside", { id: "lb-gside", "aria-label": "כל הכלים" });
    el.scrim = make("div", "lb-gscrim", { "data-gnav": "close" });

    document.body.append(el.side, el.scrim, el.bottom);

    draw();
    // anything the page marks for the path row (HQ: its data freshness) moves to its end
    document.querySelectorAll("[data-lb-gpath-slot]").forEach((n) => el.path.querySelector(".lb-gpath-slot").append(n));
    el.bar.addEventListener("click", onClick); el.path.addEventListener("click", onClick); el.side.addEventListener("click", onClick);

  function draw() {
    if (!el.bar) return;
    const cur = findCurrent(S.L);
    el.bar.innerHTML = topBar(cur);
    const slot = el.path.querySelector(".lb-gpath-slot"), kept = slot ? [...slot.childNodes] : [];
    el.path.innerHTML = path(cur);
    el.path.querySelector(".lb-gpath-slot").append(...kept);
    const scroll = el.side.querySelector(".lb-gside-scroll"), top = scroll ? scroll.scrollTop : 0;

    el.side.querySelector(".lb-gside-scroll").scrollTop = top;
    el.bottom.innerHTML = bottom(cur);

  function applyState() {
    const phone = PHONE.matches, open = root.classList.contains("lb-gdrawer-open");

  }
  function closeDrawer(refocus = true) {
    if (!root.classList.contains("lb-gdrawer-open")) return;
    root.classList.remove("lb-gdrawer-open"); applyState();

  }
  // a topic in the top bar, the path or the bottom bar opens its tools in the side bar (the second layer)
  function showTopic(id) {
    S.focus = id;
    el.side.querySelectorAll("[data-gtopic-sec]").forEach((s) => s.classList.toggle("is-focus", s.dataset.gtopicSec === id));
    if (PHONE.matches) openDrawer(); else if (!expanded) setExpanded(true);
    const sec = el.side.querySelector(`[data-gtopic-sec="${CSS.escape(id)}"]`), scroll = el.side.querySelector(".lb-gside-scroll");

  }
  function onClick(e) {
    const t = e.target.closest("[data-gtopic], [data-gnav], a");
    if (!t) return;
    if (t.dataset.gtopic) return showTopic(t.dataset.gtopic);
    const act = t.dataset.gnav;
    if (act === "toggle") return PHONE.matches ? openDrawer() : setExpanded(!expanded);
    if (act === "more") { S.focus = ""; el.side.querySelectorAll(".is-focus").forEach((s) => s.classList.remove("is-focus")); return openDrawer(); }
    if (act === "close") return closeDrawer();
    if (t.tagName === "A" && root.classList.contains("lb-gdrawer-open")) closeDrawer(false);   // a link inside HQ (#view) keeps the page
  }
  function onKey(e) {
    if (!root.classList.contains("lb-gdrawer-open")) return;
    if (e.key === "Escape") { e.preventDefault(); return closeDrawer(); }
    if (e.key !== "Tab") return;   // keep the focus inside the open drawer
    const f = [...el.side.querySelectorAll("a[href], button")].filter((n) => n.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];

  }

  // ---------- phones: the top and bottom bars slide away while scrolling down ----------
  function setAway(on) { if (S.away === on) return; S.away = on; root.classList.toggle("lb-gnav-away", on); }
  let ticking = false;
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const y = Math.max(0, window.scrollY);
      if (!PHONE.matches || root.classList.contains("lb-gdrawer-open")) { S.lastY = y; return setAway(false); }
      if (y < 56) setAway(false);
      else if (y > S.lastY + 6) setAway(true);
      else if (y < S.lastY - 6) setAway(false);
      if (Math.abs(y - S.lastY) > 6) S.lastY = y;
    });
  }

  // on the project server the side bar follows HQ's saved arrangement as it is now
  async function loadSaved() {
    try {
      const r = await fetch("/api/hq/layout", { cache: "no-store" });
      if (r.ok) { const j = await r.json(); if (j && (Array.isArray(j.topics) || j.default)) { S.L = mergeLayout(j); draw(); } }
    } catch {}
  }

  // ---------- for HQ ----------
  window.LBNav = {
    MODE, toolId, toolLinks, defaultLayout, mergeLayout,
    // HQ's own layout as it loads and as Yarin edits it
    setLayout(L) { S.L = clone(L); draw(); },
    // HQ's view: { view: "overview", title: "סקירה" }
    setCurrent({ view, title } = {}) { S.view = view || null; S.viewTitle = title || ""; draw(); },
  };

  if (document.body) mount(); else document.addEventListener("DOMContentLoaded", mount);
})();
</script>

.tip { position: absolute; left: 50%; bottom: var(--sp-3); transform: translateX(-50%); z-index: 30; width: max-content; max-width: 88%; margin: 0; padding: .45rem .9rem; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-2); font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 600; color: var(--text-2); text-align: center; animation: fade-up .3s ease both; }
.tip.warn { color: var(--warning); }

/* ---------- the device: mockup frame over a 393 x 856 screen ---------- */
.device-wrap { position: relative; direction: ltr; flex: none; }
.device { position: absolute; top: 0; left: 0; width: 450.4px; height: 901.5px; transform-origin: 0 0; }
.device .frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; user-select: none; z-index: 20; }
.screen { position: absolute; left: 27.4px; top: 21.6px; width: 395px; height: 857.7px; border-radius: 56px; overflow: hidden; background: #000; direction: rtl; isolation: isolate;
  --ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
  --site: "Varela Round", var(--ios); --serif: "Fraunces", Georgia, serif;
  --ink: #0B0518; --ink-2: #160c2e; --cream: #F8F0E1; --gold: #E6B762; --gold-2: #C9954A; --violet: #5B2BD6;
  --fb-blue: #1877F2; --fb-bg: #F0F2F5; --fb-line: #CED0D4; --fb-text: #050505; --fb-text-2: #65676B; --fb-btn: #E4E6EB;
  --wa-bg: #EFEAE2; --wa-in: #FFFFFF; --wa-out: #D9FDD3; --wa-text: #111B21; --wa-text-2: #667781; --wa-link: #027EB5; --wa-green: #25D366; --wa-tick: #53BDEB;
  font-family: var(--ios); -webkit-font-smoothing: antialiased; }
.device-wrap.bare .device { width: 393px; height: 856px; }
.device-wrap.bare .frame { display: none; }
@media (max-width: 640px) { .phone-stage, .hero-stage { padding: var(--sp-3); border-radius: 1.5rem; } }
.device-wrap.bare .screen { left: 0; top: 0; width: 393px; height: 856px; border-radius: 46px; box-shadow: 0 0 0 1px var(--line-strong), 0 30px 60px -30px rgba(0,0,0,.45); }
.device-wrap.bare .screen::after { content: ""; position: absolute; top: 11px; left: 50%; width: 125px; height: 37px; margin-left: -62.5px; border-radius: 20px; background: #000; z-index: 30; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.view.enter { animation: view-in .38s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes view-in { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; position: relative; overscroll-behavior: contain; scroll-behavior: smooth; }
.scroll::-webkit-scrollbar { display: none; }
.sp { flex: 1; }

/* iOS status bar and home indicator */
.sb { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 25; direction: ltr; display: flex; justify-content: space-between; align-items: center; pointer-events: none; color: #000; font: 600 17px/1 var(--ios); letter-spacing: -.3px; }
.sb.on-dark { color: #fff; }
.sb-time { width: 134px; text-align: center; padding-top: 3px; }
.sb-icons { width: 134px; display: flex; justify-content: center; align-items: center; gap: 6px; padding-top: 3px; }
.sb-icons svg { display: block; }
.hi { position: absolute; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: #000; z-index: 25; pointer-events: none; }
.hi.on-dark { background: #fff; }

/* hotspots */
[data-note] { position: relative; }
.hot { position: absolute; top: -9px; inset-inline-end: 4px; width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: var(--gold); color: var(--ink); font: 800 12px/1 var(--ios); display: grid; place-items: center; cursor: pointer; z-index: 15; box-shadow: 0 4px 12px rgba(0,0,0,.28); animation: hot-in .35s ease both; }
.hot::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid var(--gold); opacity: 0; animation: ping 2.4s ease-out infinite; }
.hot:hover, .hot.is-active { transform: scale(1.12); }
.hot.is-active::before { animation-duration: 1.2s; }
.hot:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
[data-note].is-lit { outline: 2.5px solid var(--gold); outline-offset: 3px; border-radius: 10px; }
.no-hots .hot { display: none; }
@keyframes hot-in { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes ping { 0% { transform: scale(.7); opacity: .9; } 80%, 100% { transform: scale(1.5); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hot, .hot::before, .view.enter, .step-top { animation: none !important; } .scroll { scroll-behavior: auto; } }

/* ---------- Facebook (light) ---------- */

.fb-acts { display: flex; justify-content: space-around; padding: 4px 8px; margin: 0 14px; border-top: 1px solid var(--fb-line); border-bottom: 1px solid var(--fb-line); color: var(--fb-text-2); font-size: 14px; font-weight: 600; }

/* covers (real art from lumebook.com with the title laid over, like the site's samples) */

.iab-btn .i { width: 20px; height: 20px; stroke-width: 2.2; }
.iab-t { flex: 1; display: grid; justify-items: center; line-height: 1.2; min-width: 0; }

.iab-t small { font-size: 12px; color: #65676B; display: inline-flex; align-items: center; gap: 3px; direction: ltr; }

/* ---------- the store (lumebook.com look) ---------- */

.ph { border: 1.5px dashed rgba(248,240,225,.28); border-radius: 12px; display: grid; place-items: center; text-align: center; font-size: 12px; color: rgba(248,240,225,.6); padding: 10px; min-height: 76px; white-space: pre-line; line-height: 1.35; }

.otp { display: flex; gap: 8px; justify-content: center; direction: ltr; }
.otp span { width: 46px; height: 56px; border-radius: 12px; border: 1px solid rgba(248,240,225,.25); background: rgba(248,240,225,.06); display: grid; place-items: center; font: 800 24px var(--site); }
.otp span.on { border-color: var(--gold); }
/* iOS notification banner */
.banner { position: absolute; top: 56px; left: 10px; right: 10px; z-index: 24; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 22px; background: rgba(245,245,247,.86); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8); color: #000; font-family: var(--ios); box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: banner-in .5s cubic-bezier(.2,.9,.25,1.15) both; cursor: pointer; }

.banner .app-ic .i { width: 24px; height: 24px; }

/* preview */

.pv-like button:not(.hot) { appearance: none; border: 1px solid rgba(248,240,225,.3); background: transparent; color: var(--cream); border-radius: 999px; padding: 7px 14px; font: 400 14px var(--site); cursor: pointer; }
.pv-like button:not(.hot)[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: rgba(230,183,98,.12); }
.pv-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pv-split > div { border-radius: 14px; padding: 12px; display: grid; gap: 4px; font-size: 13.5px; align-content: start; }
.pv-split .ready { background: rgba(74,222,128,.08); border: 1px solid rgba(74,222,128,.3); }
.pv-split .later { border: 1px dashed rgba(248,240,225,.28); }
.pv-split b { font-size: 14px; }
.pv-samples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pv-radio { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px; border-radius: 14px; border: 1px solid rgba(248,240,225,.16); font-size: 14px; cursor: pointer; }
.pv-radio input { accent-color: var(--gold); width: 18px; height: 18px; margin: 0; }
.pv-radio small { display: block; font-size: 12px; color: rgba(248,240,225,.6); }
.pv-radio b { color: var(--gold); font-weight: 400; }
.pv-radio:has(input:checked) { border-color: var(--gold); background: rgba(230,183,98,.08); }
.pv-sum { gap: 4px; }
.pv-sum .row { display: flex; justify-content: space-between; gap: 10px; }
.pv-sum .tot { font: 800 20px var(--serif); color: var(--gold); border-top: 1px solid rgba(248,240,225,.12); padding-top: 8px; margin-top: 4px; }

/* CardCom in the store's look */
.pay-brand { display: flex; align-items: center; gap: 10px; padding: 16px; border-bottom: 1px solid rgba(248,240,225,.1); }
.pay-brand img { width: 40px; height: 40px; border-radius: 9px; }
.pay-brand div { display: grid; line-height: 1.3; }
.pay-brand small { font-size: 12.5px; color: rgba(248,240,225,.65); display: inline-flex; align-items: center; gap: 4px; }
.pay-brand .i { width: 13px; height: 13px; }
.pay-w { display: grid; gap: 8px; }
.pay-w button:not(.hot) { appearance: none; height: 50px; border-radius: 12px; border: 0; font: 600 18px var(--ios); cursor: pointer; direction: ltr; display: flex; align-items: center; justify-content: center; gap: 4px; letter-spacing: -.3px; }
.pay-w .apple:not(.hot) { background: #fff; color: #000; }
.pay-w .google:not(.hot) { background: #000; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
.pay-w .bit:not(.hot) { background: rgba(248,240,225,.1); color: var(--cream); font-weight: 800; }
.pay-or { text-align: center; font-size: 13px; color: rgba(248,240,225,.55); display: flex; align-items: center; gap: 10px; }
.pay-or::before, .pay-or::after { content: ""; flex: 1; height: 1px; background: rgba(248,240,225,.15); }

/* thanks */
.ty-check { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(160deg, var(--gold), var(--gold-2)); display: grid; place-items: center; color: var(--ink); justify-self: center; animation: pop .5s cubic-bezier(.2,.9,.3,1.4) both; }
.ty-check .i { width: 34px; height: 34px; stroke-width: 3; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.ty-h { text-align: center; display: grid; gap: 2px; }
.ty-h b { font: 800 28px var(--serif); }
.ty-h span { font-size: 16px; }
.ty-h small { font-size: 12.5px; color: rgba(248,240,225,.6); }
.ty-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.ty-steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; position: relative; opacity: .55; }
.ty-steps li::after { content: ""; position: absolute; top: 30px; bottom: 2px; inset-inline-start: 14px; width: 2px; background: rgba(248,240,225,.15); }
.ty-steps li:last-child::after { display: none; }
.ty-steps li.now { opacity: 1; }
.ty-steps .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid rgba(248,240,225,.4); font: 800 13px var(--site); }
.ty-steps li.now .n { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.ty-steps div { display: grid; gap: 4px; font-size: 13.5px; }
.ty-steps b { font-size: 15px; }
.ty-extra { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; }
.ty-extra img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
.ty-extra div { display: grid; gap: 6px; }
.ty-row { display: flex; gap: 6px; }
.ty-row > * { flex: 1; min-width: 0; height: 44px; font-size: 15px; }
.ty-who { display: grid; gap: 8px; }
.ty-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ty-chips button { appearance: none; border: 1.5px solid var(--gold); background: transparent; color: var(--gold); border-radius: 999px; padding: 8px 12px; min-height: 40px; font: 400 14px var(--site); cursor: pointer; }
.ty-chips button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }

/* ---------- WhatsApp (light) ---------- */
.wa { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--wa-bg); color: var(--wa-text); }
.wa-head { display: flex; align-items: center; gap: 8px; padding: 54px 10px 8px; background: #F6F5F3; border-bottom: 1px solid rgba(0,0,0,.08); }
.wa-head .back { color: #007AFF; display: flex; align-items: center; }
.wa-head .back .i { width: 26px; height: 26px; stroke-width: 2.4; }
.wa-head img { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(0,0,0,.08); }
.wa-head div { flex: 1; display: grid; line-height: 1.2; min-width: 0; }
.wa-head b { font-size: 16.5px; display: inline-flex; align-items: center; gap: 4px; }
.wa-head b .i { width: 15px; height: 15px; color: var(--wa-green); }
.wa-head small { font-size: 12.5px; color: var(--wa-text-2); }
.wa-head .act { color: #007AFF; }
.wa-head .act .i { width: 24px; height: 24px; }
.wa-body { background-color: var(--wa-bg); background-image: radial-gradient(rgba(0,0,0,.045) 1.2px, transparent 1.2px), radial-gradient(rgba(0,0,0,.03) 1px, transparent 1px); background-size: 22px 22px, 13px 13px; background-position: 0 0, 7px 9px; padding: 10px 10px 20px; display: flex; flex-direction: column; gap: 6px; }
.wa-day { align-self: center; background: #fff; color: var(--wa-text-2); font-size: 12.5px; font-weight: 600; border-radius: 8px; padding: 5px 11px; box-shadow: 0 1px .5px rgba(11,20,26,.13); margin: 8px 0 2px; }
.wa-sys { align-self: center; max-width: 88%; text-align: center; background: #FFEECD; color: #54656F; font-size: 12.5px; line-height: 1.4; border-radius: 8px; padding: 6px 10px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.wa-sys b { color: #3b4a54; }
.wa-msg { max-width: 82%; display: grid; }
.wa-msg.in { align-self: flex-start; }
.wa-msg.out { align-self: flex-end; }
.wa-b { position: relative; padding: 7px 9px 8px; border-radius: 8px; font-size: 15.5px; line-height: 1.35; white-space: pre-line; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.wa-msg.in .wa-b { background: var(--wa-in); border-start-start-radius: 0; }
.wa-msg.out .wa-b { background: var(--wa-out); border-start-end-radius: 0; }
.wa-b .adv { display: block; font-weight: 700; font-size: 14px; }
.wa-b .lnk { color: var(--wa-link); direction: ltr; unicode-bidi: isolate; }
.wa-b .stop { display: block; color: var(--wa-text-2); font-size: 13px; margin-top: 4px; }
.wa-t { float: left; margin: 6px 8px -4px 0; font-size: 11px; color: var(--wa-text-2); direction: ltr; display: inline-flex; align-items: center; gap: 2px; }
.wa-t .i { width: 16px; height: 16px; color: var(--wa-tick); stroke-width: 2.2; }
.wa-btns { display: grid; gap: 1px; margin-top: 1px; }
.wa-btns span { background: #fff; color: var(--wa-link); text-align: center; font-size: 15px; padding: 9px; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.wa-btns span:last-child { border-radius: 0 0 8px 8px; }
.wa-btns .i { width: 16px; height: 16px; }
.wa-msg.in .wa-b:has(+ .wa-btns) { border-radius: 0 8px 0 0; }
.wa-blocked { opacity: .42; filter: grayscale(1); }
.wa-blocked .wa-b { box-shadow: none; outline: 1.5px dashed rgba(0,0,0,.35); }
.demo-tag { align-self: flex-start; font-family: var(--ios); font-size: 11px; font-weight: 700; color: #6b5ea8; background: rgba(255,255,255,.72); border: 1px dashed rgba(91,43,214,.45); border-radius: 999px; padding: 2px 9px; margin: -1px 0 4px; }
.demo-tag.mkt { color: #8A5A14; border-color: rgba(201,149,74,.7); }
.wa-ghost { align-self: flex-start; max-width: 70%; padding: 8px 11px; border-radius: 8px; border: 1.5px dashed rgba(0,0,0,.28); color: rgba(0,0,0,.4); font-size: 15px; text-decoration: line-through; }
.wa-people { align-self: center; display: flex; gap: 3px; direction: ltr; font-size: 18px; }
.wa-people span.out { opacity: .22; }
.wa-reveal { align-self: flex-end; appearance: none; border: 1.5px dashed rgba(0,0,0,.3); background: rgba(255,255,255,.6); color: #3b4a54; border-radius: 999px; padding: 6px 12px; font: 600 13px var(--ios); cursor: pointer; }
.wa-input { display: flex; align-items: center; gap: 10px; padding: 8px 10px 34px; background: #F6F5F3; border-top: 1px solid rgba(0,0,0,.06); color: #007AFF; }
.wa-input .i { width: 24px; height: 24px; }
.wa-input div { flex: 1; height: 36px; border-radius: 18px; background: #fff; border: 1px solid rgba(0,0,0,.08); }

/* ---------- all changes ---------- */
.changes { display: grid; gap: var(--sp-5); }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: var(--sp-3); }
.first5 { grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
.first5 ol { margin: var(--sp-2) 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.first5 li a { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: var(--sp-3); padding: .45rem var(--sp-2); border-radius: var(--r-sm); color: var(--text); text-decoration: none; font-weight: 600; }
.first5 li a:hover { background: var(--fill); text-decoration: none; }
.first5 small { display: block; font-family: var(--font-2); font-weight: 500; font-size: var(--fs-caption); color: var(--text-3); }
@media (max-width: 560px) { .first5 { grid-template-columns: minmax(0, 1fr); } .first5 .mascot { display: none; } }
/* filters: two lb-filters groups, each after its label; groups of changes are lb-topic sections with an lb-topic-head */
.filters { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); align-items: center; }
.filters .lbl { font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); }
.lb-topic-head > a { font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; white-space: nowrap; }
.lb-rowitem-body > a { justify-self: start; font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 600; }
.gloss > summary { cursor: pointer; font-weight: 700; font-size: var(--fs-headline); }
.gloss .lb-kv { margin-top: var(--sp-3); }
</style>

const TERM_RE = new RegExp("(" + Object.keys(TERMS).sort((a, b) => b.length - a.length).map(t => t.replace(/[/]/g, "\\/")).join("|") + ")", "g");
/* Latin runs inside Hebrew notes are isolated so event names, links and code keep their order */
const LAT_RUN = /[A-Za-z][A-Za-z0-9_.:=\/&?#%+@\-]*(?: (?=[A-Za-z0-9])[A-Za-z0-9_.:=\/&?#%+@\-]+)*/g;
function gloss(text) {
  const seen = new Set();
  return esc(text).replace(LAT_RUN, m => `<bdi dir="ltr">${m}</bdi>`).replace(TERM_RE, m => {
    const key = TERMS[m];
    if (!key || seen.has(key) || !GMAP[key]) return m;
    seen.add(key);
    return `<abbr title="${esc(GMAP[key])}">${m}</abbr>`;
  });
}

function fitDevices() {
  const fit = document.body.classList.contains("fit"), main = $("main"), ms = getComputedStyle(main);
  const mainH = main.clientHeight - parseFloat(ms.paddingTop) - parseFloat(ms.paddingBottom);
  $$(".device-wrap").forEach(w => {

    const avail = col.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);

    w.style.width = base.w * k + "px"; w.style.height = base.h * k + "px";

/* draw one screen into a device; keep = keep the scroll position */
function paintScreen(wrap, id, opts) {
  opts = opts || {};

  const old = $(".scroll", v), top = opts.keep && old ? old.scrollTop : 0;
  $(".sb", screen).className = "sb " + (sc.sb || ""); $(".sb", screen).innerHTML = statusBar();
  $(".hi", screen).className = "hi " + (sc.hi || "");
  v.innerHTML = sc.render();
  if (opts.enter) { v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); }
  const markers = new Set();
  if (!opts.static) {
    $$("[data-note]", v).forEach(el => {
      const n = +el.dataset.note; markers.add(n);
      const b = document.createElement("button");
      b.type = "button"; b.className = "hot"; b.textContent = n; b.setAttribute("aria-label", "פתיחת הערה " + n);
      b.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); activate(n, true); });
      el.appendChild(b);
    });

    sc.bind && sc.bind(v);
  } else {
    $$("button, input, select", v).forEach(el => { el.tabIndex = -1; });
    wrap.style.pointerEvents = "none";
  }
  const sv = $(".scroll", v); if (sv) sv.scrollTop = top;
  return markers;
}

function lightUp(n, scroll) {

  }
}

  else if (v === "changes" && journeyDone) { view = v; cur = 0; setFit(); renderChanges(); }
  else { view = "intro"; cur = 0; setFit(); renderIntro(); }
  if (/^https?:$/.test(location.protocol)) { try { history.replaceState(null, "", "#" + view); } catch (e) { /* not available */ } }
  progress();
  window.scrollTo(0, 0);
}
/* the bar under the top bar: 0 on the intro, one tenth per step, full on the list of changes, in the stage's colour */
function progress() {
  const n = view === "changes" ? STEPS.length : cur, bar = $("#progress");
  bar.style.setProperty("--p", (n / STEPS.length * 100) + "%");
  bar.style.setProperty("--pc", cur ? `var(--cat-${stageOf(cur).cat})` : view === "changes" ? "var(--success)" : "var(--tint)");
  bar.setAttribute("aria-valuenow", n);
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  show(a.getAttribute("href").slice(1));
});
addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (h && h !== view) show(h); });
let start = "";
try { start = location.hash.replace("#", ""); } catch (e) { /* no hash */ }
show(start);
})();
</script>
</body>
</html>
