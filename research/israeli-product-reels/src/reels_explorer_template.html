<title>מערכת הרילס</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
__DESIGN_HEAD__
<style>
/* מערכת הרילס: one Hebrew tool for everything about reels (Yarin, 05 Nov 2026). Sidebar of sections, sticky top bar with one search
   over everything, one view at a time (hash routes). Page rules use the design system tokens only. The calendar view brings the
   stand-alone calendar page's own rules, appended below (build: src/hub_calendar.py). */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
.lb-page, .lb-topbar-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 861px) { .lb-page, .lb-topbar-in { padding-left: max(var(--sp-5), env(safe-area-inset-left, 0px)); padding-right: max(var(--sp-5), env(safe-area-inset-right, 0px)); } }
.lb-page { gap: var(--sp-5); }
.lb-sidebar { gap: var(--sp-2); }
.lb-brand { padding-block: var(--sp-1) var(--sp-3); }
.he { font-family: var(--font); unicode-bidi: isolate; }
.he-block { white-space: pre-line; background: var(--surface-2); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-callout); line-height: 1.65; margin: 0; overflow-wrap: anywhere; }
.he-list { margin: 0; padding-inline-start: 1.5rem; display: grid; gap: .35rem; font-size: var(--fs-callout); line-height: 1.6; }
.mixed-list { margin: 0; padding-inline-start: 1.2rem; display: grid; gap: .3rem; font-size: var(--fs-callout); }
.sub-h { font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; color: var(--text-3); }
.col { display: grid; gap: var(--sp-2); align-content: start; min-width: 0; }
.reel-date { font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; width: 4.6rem; flex: none; line-height: 1.25; }
.reel-date b { display: block; color: var(--text); font-size: var(--fs-callout); }
@media (max-width: 640px) { .reel-date { width: 3.6rem; } }
.filters { display: grid; gap: var(--sp-2); }
.filter-row { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-2); align-items: center; }
.filter-row > .lbl { font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; color: var(--text-3); width: 4.75rem; flex: none; }
button.lb-chip { border: 0; cursor: pointer; }
button.lb-chip:not(.cat)[aria-pressed="true"] { background: var(--text); color: var(--bg); }
button.lb-chip:focus-visible, .lb-btn:focus-visible, a:focus-visible, summary:focus-visible, .lb-nav-item:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.code { direction: ltr; text-align: left; unicode-bidi: isolate; font-family: var(--font-mono); font-size: var(--fs-footnote); background: var(--surface-sunk); padding: .2rem .45rem; border-radius: var(--r-xs); overflow-wrap: anywhere; color: var(--text); }
.copy-row { display: flex; gap: var(--sp-2); align-items: flex-start; min-width: 0; }
.copy-row .code { flex: 1; min-width: 0; }
.mini-btn { border: 0; box-shadow: var(--glass-rim), 0 2px 6px -2px rgba(41, 30, 22, .18); background: var(--glass-sheen), var(--glass-thick); color: var(--tint); border-radius: var(--r-pill); font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; padding: .15rem .6rem; cursor: pointer; flex: none; }
.mini-btn:hover { border-color: var(--tint); }
a.card-link { color: inherit; text-decoration: none; }
a.card-link:hover { border-color: var(--tint); text-decoration: none; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr)); gap: var(--sp-2); list-style: none; margin: 0; padding: 0; }
.steps a { display: grid; gap: .2rem; padding: var(--sp-3); border-radius: var(--r-md); background: var(--glass-sheen), var(--glass-card); box-shadow: var(--glass-card-rim-sm), 0 10px 20px -16px rgba(41, 30, 22, .3); color: var(--text); text-decoration: none; height: 100%; font-size: var(--fs-footnote); line-height: 1.4; }
.steps a:hover { background: var(--tint-soft); text-decoration: none; }
.steps .n { font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; color: var(--tint); }
.steps b { font-size: var(--fs-callout); }
.find-list { margin: 0; padding-inline-start: 1.1rem; display: grid; gap: .3rem; font-size: var(--fs-callout); color: var(--text-2); }
.card-head { display: flex; align-items: flex-start; gap: var(--sp-3); }
.card-head > div { min-width: 0; flex: 1; }
.card-head h3 { font-size: var(--fs-headline); }
.meta { font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); }
.letter { display: inline-grid; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: .6rem; background: var(--tint-soft); color: var(--tint); font-weight: 800; font-size: var(--fs-headline); flex: none; }
.grp-head { display: flex; align-items: center; gap: var(--sp-3); padding-top: var(--sp-3); }
.grp-head h3 { font-size: var(--fs-headline); }
.grp-head .meta { margin-inline-start: auto; }
.kv-tight { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--sp-2) var(--sp-4); font-size: var(--fs-callout); margin: 0; }
.kv-tight dt { font-family: var(--font-2); font-weight: 600; color: var(--text-3); }
.kv-tight dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 520px) { .kv-tight { grid-template-columns: minmax(0, 1fr); gap: 0 0; } .kv-tight dd { margin-bottom: var(--sp-2); } }
.result { display: flex; gap: var(--sp-3); align-items: flex-start; padding: .7rem var(--sp-4); cursor: pointer; background: none; border: 0; width: 100%; text-align: start; font: inherit; color: inherit; }
.result:hover { background: var(--fill); }
.result .lb-sum { flex: 1; min-width: 0; }
.result small { display: block; color: var(--text-3); font-size: var(--fs-footnote); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topsearch { width: min(19rem, 38vw); }
.topsearch .lb-input { height: 2.2rem; }
@media (max-width: 640px) { #pageTitle { display: none; } .topsearch { width: auto; flex: 1; } }
.flash { animation: flash 1.8s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px var(--focus); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } .lb-disclosure > summary::after { transition: none; } }
.empty { padding: var(--sp-5); text-align: center; color: var(--text-3); font-size: var(--fs-callout); }
.weak-table td { vertical-align: top; min-width: 12rem; }
.lead { font-size: var(--fs-body); color: var(--text-2); max-width: 46rem; line-height: 1.55; margin: 0; }
/* the month is a glass card and its days are sheets on it (07 Nov 2026, the creator map's stacked glass) */
.cal-month { gap: var(--sp-3); padding: var(--sp-4); }
.cal-month .lb-day { overflow: hidden; }
.cal-month .lb-day:not(.is-out) { box-shadow: var(--glass-card-rim-sm), 0 12px 22px -16px rgba(41, 30, 22, .34); }
.cta-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: var(--sp-3); }
#save-state { min-width: 6.5rem; justify-content: center; }
/* the calendar view (from the stand-alone calendar page) */
__CAL_CSS__
</style>

<div class="lb-app" dir="rtl" lang="he">
  <aside class="lb-sidebar" id="sidebar" aria-label="אזורים">
    <a class="lb-brand" href="#overview"><img src="__LOGO__" alt=""><span><b>מערכת הרילס</b><small>לומבוק, נכון ל 05 / 11 / 2026</small></span></a>
    <nav class="lb-nav" id="nav"></nav>
    <div class="lb-sidebar-foot">
      <span>נבנה מ reels.json, playbook.md ו principles.md על ידי src/build_reels_explorer.py.</span>
    </div>
  </aside>
  <div class="lb-scrim" id="scrim" hidden></div>
  <main class="lb-main">
    <header class="lb-topbar"><div class="lb-topbar-in">
      <button class="lb-btn secondary lb-menu-btn" id="menuBtn" type="button" aria-controls="sidebar" aria-expanded="false">תפריט</button>
      <h1 id="pageTitle">סקירה</h1>
      <span class="lb-spacer"></span>
      <label class="lb-search topsearch"><span class="lb-sr">חיפוש בכל המערכת</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="lb-input" id="q" type="search" placeholder="חיפוש רילס, כללים, כלים" autocomplete="off">
      </label>
      <span id="save-state" class="lb-chip" role="status" aria-live="polite">טוען...</span>
      __THEME_TOGGLE__
    </div></header>
    <div class="lb-page" id="view"></div>
  </main>
</div>
<div id="calHold">__CAL_CARDS__</div>

<script>
const D = __DATA__;
const C = D.calendar, P = D.playbook, PR = D.principles, K = D.catalog, CAL = D.cal;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const he = (s, cls = "") => `<bdi class="he ${cls}" dir="rtl" lang="he">${esc(s)}</bdi>`;
const auto = s => `<bdi dir="auto">${esc(s)}</bdi>`;
const oneLine = s => String(s || "").replace(/\n+/g, " / ");
const fmtDate = iso => { const [y, m, d] = iso.split("-"); return `${d} / ${m} / ${y}`; };
const DAYS = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
const dow = iso => DAYS[new Date(iso + "T12:00:00").getDay()];
const TODAY = (() => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; })();
const STATUS = {"posted": ["פורסם", "success"], "needs-voice": ["מחכה לצילום וקריינות שלך", "warning"], "needs-footage": ["מחכה לחומר", "danger"]};
const APPROACH = Object.fromEntries(P.approaches.map(a => [a.k, a]));
const GROUP = Object.fromEntries(PR.groups.map(g => [g.k, g]));
const CONCEPT_REEL = {1: "1.4", 2: "4.1", 3: "5.1", 4: "1.7"};
const STRENGTH = ["strong", "moderate", "weak", "contested"];
const STRENGTH_HE = {strong: "חזקה", moderate: "בינונית", weak: "חלשה", contested: "שנויה במחלוקת"};

const ICON = {
  home: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  stack: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  tool: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  film: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

const SECTIONS = [
  {id: "overview", t: "סקירה", icon: "home"},
  {label: "תוכנית"},
  {id: "calendar", t: "לוח הרילס", icon: "cal", n: C.reels.length},
  {label: "מחקר"},
  {id: "playbook", t: "פלייבוק צילום", icon: "book", n: P.approaches.length + P.concepts.length},
  {id: "principles", t: "עקרונות", icon: "list", n: PR.items.length},
  {id: "library", t: "ספריית מחקר", icon: "stack", n: K.library.length},
  {label: "הפקה"},
  {id: "tools", t: "כלים", icon: "tool", n: K.tools.length},
  {id: "made", t: "רילס שנעשו", icon: "film", n: K.jobs.length},
];
const TITLE = Object.fromEntries(SECTIONS.filter(s => s.id).map(s => [s.id, s.t]));

const F = {
  pr: {g: "all", s: "all", q: ""},
  tools: {kind: "all"},
  made: {kind: "all", status: "all"},
  pb: {tab: "findings"},
};
let query = "";

/* ---------- shared pieces ---------- */
function chip(group, key, value, label, cat) {
  const on = F[group][key] === value;
  const cls = cat !== undefined ? `lb-chip cat lb-cat-${cat}` : "lb-chip outline";
  return `<button type="button" class="${cls}" data-f="${group}.${key}" data-v="${esc(value)}" aria-pressed="${on}">${label}</button>`;
}
function filterRow(label, html) { return `<div class="filter-row"><span class="lbl">${label}</span>${html}</div>`; }
function copyRow(id, text) { return `<div class="copy-row"><span class="code" id="${id}">${esc(text)}</span><button type="button" class="mini-btn" data-copy="${id}">העתקה</button></div>`; }
function pid(id, cat, go) {
  const c = cat ? ` lb-cat-${cat}` : "";
  return go ? `<a class="lb-pid${c}" href="#${go[0]}" data-go="${go[0]}" data-target="${esc(go[1])}">${esc(id)}</a>` : `<span class="lb-pid${c}">${esc(id)}</span>`;
}
function statusChip(s) { const [t, c] = STATUS[s] || [s, ""]; return `<span class="lb-chip ${c}">${esc(t)}</span>`; }
function seriesChip(n) { const s = C.series[n]; return `<span class="lb-chip cat lb-cat-${s.cat}">${esc(s.he)}</span>`; }
function sectionHead(title, meta) { return `<div class="lb-section-head"><h2>${title}</h2>${meta ? `<span class="lb-meta">${meta}</span>` : ""}</div>`; }
const plural = (n, one, many) => n === 1 ? one : many;

/* ---------- overview ---------- */
function vOverview() {
  const posted = C.reels.filter(r => r.status === "posted").length;
  /* two options a day (10 Nov 2026): a day shows its picked option, else option 1, and says when nothing is picked yet */
  const ofDay = d => C.reels.filter(r => r.date === d).sort((a, b) => b.picked - a.picked || a.option - b.option);
  const today = ofDay(TODAY)[0];
  const nextDay = (C.reels.filter(r => r.date && r.date >= TODAY && r.status !== "posted").map(r => r.date).sort()[0]);
  const next = (nextDay && ofDay(nextDay)[0]) || C.reels.find(r => r.status !== "posted");
  const shoot = C.shoots.find(s => s.date >= TODAY);
  const reelById = Object.fromEntries(C.reels.map(r => [r.id, r]));
  const stat = (href, label, value, small, foot) => `<a class="lb-card card-link" href="#${href}"><div class="lb-stat"><span class="lb-stat-label">${label}</span><span class="lb-stat-value">${value}${small ? `<small>${small}</small>` : ""}</span><span class="lb-stat-foot">${foot}</span></div></a>`;
  const focus = today || next;
  const unpicked = focus && focus.option && !focus.picked;
  const days = new Set(C.reels.filter(r => r.date).map(r => r.date)).size;
  const grandma = C.reels.filter(r => r.audience === "grandma" && r.status !== "posted").length;
  const steps = [
    ["library", "מחקר", "173 רילס, 64 סרטונים קצרים, 147 תכנים של מתחרים"],
    ["principles", "עקרונות", `${PR.items.length} כללים, ולכל אחד עוצמת ראיות`],
    ["playbook", "פלייבוק", "7 גישות, 5 קונספטים"],
    ["calendar", "תסריטים", "ריל ביום, מתוך reels.json"],
    ["calendar", "צילום", "קטעי פתיחה וקריינות בימי שישי"],
    ["tools", "עריכה", "המתכון של ריל 1.1 ועורך הרילס"],
    ["tools", "פרסום", "ריל ניסיון ב 21:30, אחרי האישור שלך"],
    ["playbook", "תיעוד", "שיעור דילוג, שיתופים, תגובות לומי, ספרים שהתחילו"],
  ];
  return `
  <section class="lb-section">
    <p class="lead">כל מה שיש לפרויקט על רילס במקום אחד: מה עולה החודש, מה המחקר אומר, הכלים שמכינים ריל והרילס שכבר נעשו. החיפוש למעלה עובר על הכול, ובלוח הרילס אפשר גם לערוך את התסריטים ולבקש שינוי.</p>
    <div class="lb-grid cols-4">
      ${stat("calendar", "ימי רילס בנובמבר", days, `${posted} פורסמו`, `ריל ביום מתוך שתי אפשרויות, ${grandma} מהרילס מדברים לסבתות`)}
      ${stat("library", "רילס שנחקרו", "173", "108 יוצרים", "רילס מוצר של יוצרים ישראלים, 15 / 10")}
      ${stat("principles", "עקרונות", PR.items.length, "8 שאלות", "לכל אחד עוצמת ראיות")}
      ${stat("made", "עבודות רילס", K.jobs.length, `${K.tools.length} כלים`, "בתיקיית media/projects")}
    </div>
  </section>
  <section class="lb-grid cols-2">
    <div class="lb-card">
      <div class="card-head"><div><span class="lb-eyebrow">${today ? "הערב ב " + esc(C.defaults.post_time) : "הריל הבא"}</span>
        <h3>${focus ? he(oneLine(focus.hook)) : "אין ריל מתוכנן"}</h3></div>
        ${focus ? pid(focus.id, C.series[focus.series].cat, ["calendar", "r-" + focus.id]) : ""}</div>
      ${focus ? `<div class="lb-row">${seriesChip(focus.series)}${statusChip(focus.status)}<span class="meta">${dow(focus.date)} ${fmtDate(focus.date)}</span>${unpicked ? `<span class="lb-chip warning">שתי אפשרויות, עוד לא בחרת</span>` : ""}</div>` : ""}
      ${focus && focus.films.length ? `<div class="col"><span class="sub-h">אתה מצלם</span><ul class="he-list">${focus.films.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
    </div>
    <div class="lb-card">
      <div class="card-head"><div><span class="lb-eyebrow">יום הצילום הבא</span>
        <h3>${shoot ? `${dow(shoot.date)} ${fmtDate(shoot.date)}` : "אין יום צילום מתוכנן"}</h3>
        ${shoot ? `<div class="meta">${shoot.for.length} ${plural(shoot.for.length, "ריל", "רילס")}</div>` : ""}</div></div>
      ${shoot ? `<p class="lb-muted lb-small" style="margin:0">${esc(shoot.note)}</p>
      <div class="lb-row">${shoot.for.map(id => reelById[id] ? pid(id, C.series[reelById[id].series].cat, ["calendar", "r-" + id]) : pid(id)).join("")}</div>` : ""}
    </div>
  </section>
  <section class="lb-section">
    ${sectionHead("איך ריל נעשה", "מהמחקר ועד התיעוד")}
    <ol class="steps">${steps.map((s, i) => `<li><a href="#${s[0]}"><span class="n">שלב ${i + 1}</span><b>${s[1]}</b><span class="lb-muted">${auto(s[2])}</span></a></li>`).join("")}</ol>
  </section>
  <section class="lb-section">
    ${sectionHead("כללים לכל ריל", "נקבעו בהחלטות שלך ובמחקר")}
    <div class="lb-group">${K.rules.map(r => `<div class="lb-group-row" style="align-items:flex-start"><div class="col" style="gap:.15rem"><b>${auto(r.t)}</b><span class="lb-muted lb-small">${esc(r.d)}</span><span class="meta">${esc(r.src)}</span></div></div>`).join("")}</div>
  </section>`;
}

/* ---------- calendar (the month grid, popup, editing and comment box come from the stand-alone calendar page) ---------- */
function vCalendar() {
  const reelById = Object.fromEntries(C.reels.map(r => [r.id, r]));
  const posted = C.reels.filter(r => r.status === "posted").length;
  return `<div id="calRoot" class="lb-stack" style="gap:var(--sp-5)">
  <section class="lb-section">
    <p class="lead">ריל אחד ביום ב ${esc(C.defaults.post_time)} שעון ישראל, כריל ניסיון באינסטגרם lumebook.il. ${posted} פורסמו, ${C.reels.length - posted} מחכים. לוחצים על יום כדי לפתוח את הריל, לערוך את הטקסטים (הכול נשמר לבד) ולבקש שינוי בהערה.</p>
  </section>
  ${CAL.brief}
  <section class="lb-section lb-card cal-month" aria-labelledby="h-month">
    <div class="lb-section-head"><h2 id="h-month" class="lb-card-title">החודש</h2>${CAL.legend}</div>
    ${CAL.filters}
    <div id="calApNote" class="lb-callout info" hidden><span>מסוננים לפי גישה <b></b>. הימים האחרים מעומעמים.</span><button type="button" class="mini-btn" data-cf="all" style="justify-self:start">ניקוי הסינון</button></div>
    ${CAL.grid}
  </section>

/* ---------- router ---------- */
const VIEWS = {overview: vOverview, calendar: vCalendar, playbook: vPlaybook, principles: vPrinciples, library: vLibrary, tools: vTools, made: vMade};
function route() { const h = location.hash.slice(1).split("/")[0]; return VIEWS[h] ? h : "overview"; }
function renderNav() {
  const cur = query ? "" : route();
  $("#nav").innerHTML = SECTIONS.map(s => s.label ? `<div class="lb-nav-label">${s.label}</div>` :
    `<a class="lb-nav-item" href="#${s.id}"${cur === s.id ? ' aria-current="page"' : ""}>${svg(s.icon)}<span class="lb-nav-text">${s.t}</span>${s.n ? `<span class="lb-nav-n">${s.n}</span>` : ""}</a>`).join("");
}
function render() {
  const r = route();
  $("#view").innerHTML = query ? vSearch() : VIEWS[r]();
  $("#pageTitle").textContent = query ? "חיפוש" : TITLE[r];
  renderNav();
  const dl = document.getElementById("dlg"); if (dl && dl.open && (query || r !== "calendar")) dl.close();   /* the reel drawer belongs to the month view */
  if (!query && r === "calendar" && window.CalMount) CalMount();
  if (window.__lbEdits) __lbEdits.apply();   /* edits made with the edit button: the view was just drawn again and the runtime does not notice it here */
}
function focusItem(id) {
  requestAnimationFrame(() => {
    if (/^r-\d/.test(id) && window.CalOpen) { CalOpen("r" + id.slice(2).replace(".", "-")); return; }
    const el = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!el) return;
    if (el.tagName === "DETAILS") el.open = true;
    el.scrollIntoView({block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  });
}
function go(sec, id, tab) {
  if (sec === "principles") F.pr = {g: "all", s: "all", q: ""};
  if (sec === "tools") F.tools.kind = "all";
  if (sec === "made") F.made = {kind: "all", status: "all"};
  if (tab) F.pb.tab = tab;
  query = ""; $("#q").value = "";
  if (route() !== sec || location.hash.slice(1) !== sec) { pendingFocus = id; if (location.hash.slice(1) === sec) { render(); focusItem(id); pendingFocus = null; } else location.hash = sec; } else { render(); if (id) focusItem(id); }
}
let pendingFocus = null, pendingCalFilter = null;
addEventListener("hashchange", () => {
