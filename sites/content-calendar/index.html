/* LumeBook design system · shared/design/lumebook.css
   One stylesheet for every internal LumeBook page (HQ dashboard, plan, creator map, research pages, carousel review).
   Builds inline this file; edit it here, then run `python3 tools/lumebook.py ripple` to rebuild every page that uses it.
   Not used by the public ambassadors site.
   Concept: Apple-style grouped surfaces on a white ground, neutral ink for text, violet for anything you can click,
   gold for brand emphasis, eight vibrant category hues for things a reader scans or filters by.
   Colours (Yarin, 06 Nov 2026): vibrant again ("lets go back to vibrant colors"): violet, gold and the eight category hues at
   full colour. For a few hours the same day the palette was lumebook.com/IL/he's (deep gold, terracotta, sage); that was undone.
   Surfaces (page, cards, sidebars, wells, fills) are pure grayscale (equal R, G and B; Yarin, 06 Nov 2026); text, lines and
   shadows keep a slight warm tint (hue 33 degrees), never pure black.
   Hebrew first (RTL, logical properties), English pages work the same way.
   Fonts (link in <head>): https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap
   Heebo is the main font, headings included; Assistant is the secondary font for labels, captions, counts, chips and
   table headers (Yarin, 18 Oct 2026). Both have Hebrew glyphs.
   Categories: which category gets which hue is in shared/design/categories.json; builds read it (design.py).
   Light and dark (Yarin, 16 Nov 2026: "add dark mode everywhere, use apple's dark mode ui principles"; this replaces the white-only
   rule of 05 Nov 2026). The page follows the system appearance (macOS, iOS, Auto) with no switch of its own: Apple's HIG says to
   avoid an app-specific appearance setting. The light tokens are the :root block below; the dark ones are the "dark mode" block
   right after it, the same names with dark values, inside @media (prefers-color-scheme: dark). Apple's rules kept there: a dim
   base ground with brighter elevated layers (a card, a sheet, a floating panel each a step lighter), brighter variants of every
   colour, 4.5:1 or more for all text (7:1 for body text), surfaces still pure grayscale, text and lines still warm. Text colours
   and fills under white text are separate tokens (--tint and --tint-solid, --danger and --danger-solid ...) because a colour
   light enough to read on a dark ground is too light under white text. A page that draws its own appearance (the store mock)
   sets data-appearance on html and the dark block leaves it alone. design.theme_toggle() still writes nothing: no switch.
   Apple design and Liquid Glass (Yarin, 07 Nov 2026): two layers, both glass. The control layer (project nav, top and edit
   bars, menus, sheets, drawers, toasts, buttons, switches, segmented controls) is Liquid Glass with blur: the tokens are --glass-* in
   :root and the rules are the "Liquid Glass" section near the end of this file. Every card is Liquid Glass too (Yarin, 07 Nov 2026:
   "construct every card in the design system to look like apple made it using liquid glass"): --glass-card* tokens and the "glass
   cards" section at the end, a translucent body, a specular rim, a lift, without blur when repeated. Tables, text, tiles and charts
   stay opaque and grayscale. Rules of the material: never glass on glass (a card inside a glass bar or card is flat), always legible
   (thick glass under text), a violet tint only through lb-glass is-tint, and it falls back to flat surfaces for more contrast and for
   browsers without backdrop-filter (Reduce Transparency only where a page sets data-honor-transparency). Other Apple rules kept here: 44px touch targets on
   touch screens, press states that scale, springy short motion that reduced motion switches off, concentric corners. */

:root {
  /* brand */
  --lb-ink: #1D1039;
  --lb-ink-deep: #0B0518;
  --lb-gold: #E6B762;
  --lb-gold-deep: #C9954A;
  --lb-violet: #5B2BD6;
  --lb-cream: #F8F0E1;

  /* surfaces: the page is white (Yarin, 06 Nov 2026: "i want the page bg white") and every grey surface is pure grayscale
     (Yarin, 06 Nov 2026: "make surfaces pure grayscale"): equal R, G and B, no tint */
  --bg: #FFFFFF;                 /* page ground, white */
  --surface: #FFFFFF;            /* cards, grouped rows, tables (a hairline sets them apart from the ground) */
  --surface-2: #EEEEEE;          /* inset areas inside a card */
  --surface-sunk: #E8E8E8;       /* wells, code, track of bars */
  --sidebar: #EEEEEE;            /* a page's own sidebar (lb-sidebar), the inner one */
  --sidenav: #E0E0E0;            /* the project nav's side bar (lb-gside), the outer one: the darkest grey (Yarin, 06 Nov 2026: inner and outer flipped) */
  --bar: rgba(255, 255, 255, .86); /* translucent sticky bars (page-specific CSS that still reads it; the glass layer uses --glass) */
  --overlay: rgba(51, 38, 27, .32);

  /* text (warm neutral ink at three strengths; all pass 4.5:1 on every surface) */
  --text: #1E1B18;
  --text-2: #4A453F;
  --text-3: #645E57;
  --text-on-tint: #FFFFFF;
  /* fills under white text (16 Nov 2026): equal to the text colours in light; dark mode lifts the text colours for contrast on a dark
     ground, so a filled button, count, check or badge reads these instead and keeps white text at 4.5:1 or more */
  --tint-solid: #5B2BD6; --tint-solid-hover: #4A1FBF;
  --success-solid: #18703F; --warning-solid: #A3520A; --danger-solid: #C2303A; --info-solid: #3653B0;
  --accent-solid: #8A5A14;      /* gold fill under white text (the accent-ink of light) */
  --kid-solid: #6D3FC9; --expert-solid: #8A5A14;   /* the carousel pillars as fills under white text; the same in dark (white on them 6.4:1 and 5.9:1) */
  --neutral-solid: #1E1B18;     /* the neutral category's tile and swatch (lb-cat-0): ink in light, a mid grey in dark */
  --ink-fill: #1E1B18; --on-ink-fill: #FFFFFF;   /* an ink pill, badge, toast or tooltip (dark on a light page); in dark a raised grey with light text, not an inverted white pill */

  /* fills (black at low alpha: they paint surfaces, so they are pure grayscale) and lines (warm ink at low alpha) */
  --fill: rgba(0, 0, 0, .045);
  --fill-2: rgba(0, 0, 0, .075);
  --fill-3: rgba(0, 0, 0, .12);
  --line: rgba(43, 36, 29, .1);
  --line-strong: rgba(43, 36, 29, .2);

  /* interactive: violet */
  --tint: #5B2BD6;
  --tint-hover: #4A1FBF;
  --tint-soft: rgba(91, 43, 214, .09);
  --focus: rgba(124, 77, 255, .5);

  /* brand emphasis: gold */
  --accent: #C9954A;
  --accent-soft: #FBEBC9;
  --accent-ink: #8A5A14;

  /* semantic */
  --success: #18703F; --success-soft: rgba(35, 149, 90, .12);
  --warning: #A3520A; --warning-soft: rgba(232, 140, 40, .16);
  --danger: #C2303A;  --danger-soft: rgba(217, 58, 58, .10);
  --info: #3653B0;    --info-soft: rgba(74, 104, 194, .11);

  /* carousel pillars */
  --kid: #6D3FC9;  --kid-soft: rgba(109, 63, 201, .11);
  --expert: #8A5A14; --expert-soft: rgba(201, 149, 74, .16);

  /* data series (sequential, light to dark) */
  --seq-1: #EEEEEE; --seq-2: #D6D6D6; --seq-3: #D2B596; --seq-4: #C9954A; --seq-5: #A87425; --seq-6: #76500F;

  /* categories (from the Product Reels Playbook, 18 Oct 2026): eight hues for a page's 3 to 8 stable categories.
     base: tiles, bars, card edges, swatches (never under text; white text fails on most of them).
     ink: category text, 4.5:1 or more on --surface, --bg, --surface-2 and its own soft ground.
     soft: tinted ground for chips, ID chips, the current sub-item. Set them through .lb-cat-1 ... .lb-cat-8.
     Separate from status (success, warning, danger, info), the carousel pillars (kid, expert) and the brand violet
     and gold: a category colour never means a state. Playbook names in brackets. */
  --cat-1: #EA7A0D; --cat-1-ink: #A3510A; --cat-1-soft: rgba(234, 122, 13, .12);  /* orange (hook) */
  --cat-2: #E0457B; --cat-2-ink: #AE2457; --cat-2-soft: rgba(224, 69, 123, .11);  /* pink (keep watching) */
  --cat-3: #2E9D57; --cat-3-ink: #1B7140; --cat-3-soft: rgba(46, 157, 87, .12);   /* green (call to action) */
  --cat-4: #2F74DB; --cat-4-ink: #1D56AA; --cat-4-soft: rgba(47, 116, 219, .11);  /* blue (what to show) */
  --cat-5: #9B4FD6; --cat-5-ink: #7433AC; --cat-5-soft: rgba(155, 79, 214, .11);  /* purple (editing) */
  --cat-6: #129C9A; --cat-6-ink: #0A6E6C; --cat-6-soft: rgba(18, 156, 154, .12);  /* teal (topic) */
  --cat-7: #5D6677; --cat-7-ink: #424958; --cat-7-soft: rgba(93, 102, 119, .13);  /* slate (filming) */
  --cat-8: #C58B22; --cat-8-ink: #85580A; --cat-8-soft: rgba(197, 139, 34, .15);  /* ochre (text and caption) */

  /* type: Heebo main (body, headings, buttons, inputs), Assistant secondary (labels, captions, counts, chips, table headers) */
  --font: "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-2: "Assistant", "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-display: var(--font); /* kept so older page CSS still resolves: headings are Heebo since 18 Oct 2026 */
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-display: clamp(1.75rem, 3.8vw, 2.375rem);
  --fs-title: 1.375rem;
  --fs-headline: 1.125rem;
  --fs-body: 1rem;
  --fs-callout: .9375rem;
  --fs-footnote: .8125rem;
  --fs-caption: .75rem;
  --fs-num: 1.875rem;

  /* space (4pt base) */
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem; --sp-7: 3rem;

  /* radius (Apple, concentric: an inner corner is its container's radius minus the padding between them, so nested shapes
     stay parallel; controls are capsules). 7 Nov 2026: one step larger than before, as in iOS 26. */
  --r-xs: .5rem; --r-sm: .625rem; --r-md: .875rem; --r-lg: 1.25rem; --r-xl: 1.75rem; --r-pill: 999px;

  /* elevation: two soft layers (a close contact shadow and a wide ambient one), never a hard edge */
  --shadow-1: 0 1px 2px rgba(41, 30, 22, .06), 0 1px 1px rgba(41, 30, 22, .03);
  --shadow-2: 0 12px 32px -14px rgba(41, 30, 22, .22), 0 2px 6px -2px rgba(41, 30, 22, .06);
  --shadow-3: 0 28px 64px -22px rgba(41, 30, 22, .34), 0 4px 14px -4px rgba(41, 30, 22, .1);
  --overlay-2: rgba(51, 38, 27, .38);               /* the backdrop behind an lb-dialog */

  /* motion (Apple: quick, springy, never decorative). --ease-spring overshoots a little; linear() gives the real spring where the
     browser has it. Press states scale to --press. Reduced motion switches all of it off below. */
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-spring: cubic-bezier(.34, 1.45, .64, 1);
  --dur-1: .14s; --dur-2: .24s; --dur-3: .42s;
  --press: .97;

  /* Liquid Glass (Apple, WWDC25), 7 Nov 2026 (Yarin: "apply apple design principles and latest liquid glass to the entire project").
     Glass is the material of the layer that floats above the content (nav, bars, menus, sheets, controls) and, without blur, of
     every card (see glass cards below); tables and text stay opaque; no glass on glass. It is a translucent grayscale tint over a blurred, saturated copy of
     what is behind it, a bright specular rim on the top edge, a darker one below, and a soft lift shadow. Every glass surface
     reads these tokens, so one switch (reduced transparency, or a browser without backdrop-filter) turns the whole layer into
     the flat surfaces below it. Never tint glass with a colour except through lb-glass is-tint (violet). */
  --glass-filter: blur(24px) saturate(190%);          /* regular and thick */
  --glass-filter-clear: blur(10px) saturate(170%);    /* over photos and video: let the picture through */
  --glass-bar: rgba(255, 255, 255, .4);               /* full-width sticky bars: the most transparent, content scrolls visibly under them */
  --glass-filter-bar: blur(32px) saturate(210%);
  --glass: rgba(255, 255, 255, .58);                  /* regular: bars and controls */
  --glass-thick: rgba(255, 255, 255, .82);            /* menus, sheets, drawers: text sits on it */
  --glass-clear: rgba(255, 255, 255, .26);            /* clear: a mark over a picture */
  --glass-grey: rgba(238, 238, 238, .8);              /* a page's own sidebar (lb-sidebar), grayscale like --sidebar */
  --glass-grey-deep: rgba(224, 224, 224, .84);        /* the project nav (lb-gside), grayscale like --sidenav: the darker one */
  --glass-sheen: radial-gradient(130% 160% at 14% -30%, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 58%);   /* light caught on the top edge */
  --glass-rim: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1px 0 rgba(0, 0, 0, .05), inset 0 0 0 1px rgba(43, 36, 29, .075);
  --glass-lift: 0 12px 36px -14px rgba(41, 30, 22, .24), 0 1px 3px rgba(41, 30, 22, .07);
  --glass-edge: 0 1px 0 rgba(43, 36, 29, .08), 0 14px 28px -22px rgba(41, 30, 22, .4);   /* a full-width bar: hairline below, then a soft fall-off */
  --glass-tint: color-mix(in srgb, var(--tint-solid) 86%, white);                          /* the lit side of tinted glass */
  /* glass cards (Yarin, 07 Nov 2026: "construct every card in the design system to look like apple made it using liquid glass"): the body is a
     translucent grayscale gradient, bright at the lit top corner and milky toward the far one, the rim is a specular edge (white on the
     top and the lit side, a dark hairline underneath, a soft glow inside), and the lift is a close contact shadow plus a wide ambient one.
     No blur on repeated cards (it shows nothing over a white page and costs a lot); floating cards (dialog, modal, comment) blur. */
  --glass-card: linear-gradient(160deg, rgba(255, 255, 255, .94) 0%, rgba(255, 255, 255, .72) 46%, rgba(238, 238, 238, .52) 100%);
  --glass-card-thick: linear-gradient(160deg, rgba(255, 255, 255, .97) 0%, rgba(255, 255, 255, .86) 50%, rgba(244, 244, 244, .8) 100%);
  --glass-card-rim: inset 0 1.5px 0 rgba(255, 255, 255, 1), inset 1px 0 0 rgba(255, 255, 255, .75), inset -1px 0 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(0, 0, 0, .055),
                    inset 0 0 0 1px rgba(43, 36, 29, .07), inset 0 0 26px rgba(255, 255, 255, .6);
  --glass-card-rim-sm: inset 0 1px 0 rgba(255, 255, 255, 1), inset 0 -1px 0 rgba(0, 0, 0, .05), inset 0 0 0 1px rgba(43, 36, 29, .07);
  --glass-card-lift: 0 1px 1px rgba(41, 30, 22, .04), 0 3px 8px -2px rgba(41, 30, 22, .05), 0 20px 38px -24px rgba(41, 30, 22, .28);

  /* the lit pieces of the glass (16 Nov 2026, so dark mode can dim them in one place): the chosen segment or tab, the current item
     on a glass panel, hover and press on it, the specular edge, side and glow of a glass card, a sheet, a window's frame, the
     composer and drop wells, the drop veil. --shade (shadows) and --ink-line (hairlines) are r, g, b for rgba(var(--shade), .2). */
  --raised: #FFFFFF;
  --raised-a: rgba(255, 255, 255, .94);
  --hover-a: rgba(255, 255, 255, .55);
  --press-a: rgba(255, 255, 255, .7);
  --hi: rgba(255, 255, 255, .95);
  --hi-2: rgba(255, 255, 255, .6);
  --hi-glow: rgba(255, 255, 255, .5);
  --sheet: rgba(255, 255, 255, .58);
  --window-frame: rgba(255, 255, 255, .85);
  --well: rgba(255, 255, 255, .74);
  --well-2: rgba(255, 255, 255, .45);
  --veil: rgba(255, 255, 255, .93);
  --shade: 41, 30, 22;
  --ink-line: 43, 36, 29;

  --sidebar-w: 15.5rem;
  --content-w: 76rem;
  color-scheme: light;
}

/* ---------- dark mode (16 Nov 2026) ----------
   Yarin: "add dark mode everywhere, use apple's dark mode ui principles". The same tokens with dark values; every rule below reads
   them, so this block is the whole palette. It follows the system appearance (Apple HIG, Dark Mode: "Avoid offering an
   app-specific appearance setting"), so there is no switch. Principles from Apple's HIG (Dark Mode, Color, Materials):
   - base and elevated: the ground is the dimmest (#000), a card is lighter (#1C1C1C, Apple's gray 6 made pure grayscale), an inset
     or a sheet on it lighter again, a floating panel, menu or dialog the lightest. Depth comes from lighter layers, not shadows.
   - not an inversion: colours get brighter, less heavy variants (Apple's dark system colours are brighter than the light ones);
     the violet for text and links is #A88BFF, the gold #EBC27E, the eight category inks are lifted to 6:1 or more.
   - contrast: every text colour is 4.5:1 or more on every surface here (text and text-2 over 8:1, the 7:1 Apple asks for in small
     text); fills under white text have their own -solid tokens at 4.5:1 or more with white.
   - glass: the same material, a translucent grey over a blurred copy of the page, with a faint top edge instead of the bright one.
   Kept from the light rules: surfaces pure grayscale (equal R, G and B), text and lines warm (hue 33), no side stripes.
   data-appearance on html (any value) keeps a page out of this block: the store mock, which draws its own night look. */
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-appearance])) {
    --bg: #000000;                 /* base: the page ground */
    --surface: #1C1C1C;            /* elevated: cards, grouped rows, tables */
    --surface-2: #2A2A2A;          /* inset areas inside a card: a step lighter, as Apple's tertiary grouped background */
    --surface-sunk: #141414;       /* wells, code, track of bars: pressed in, darker than the card */
    --sidebar: #1A1A1A;            /* a page's own sidebar (lb-sidebar), the inner one */
    --sidenav: #262626;            /* the project nav (lb-gside), the outer one: on a dark ground the lighter of the two */
    --bar: rgba(22, 22, 22, .86);
    --overlay: rgba(0, 0, 0, .5);

    --text: #F5F2EE;               /* 15.3:1 on --surface */
    --text-2: #CFC9C1;             /* 10.4:1 */
    --text-3: #A8A199;             /* 6.7:1, 5.5:1 on --surface-2 */
    --text-on-tint: #FFFFFF;
    --tint-solid: #7350F2; --tint-solid-hover: #6440E8;     /* white on them 5.1:1 and 5.9:1 */
    --success-solid: #23874D; --warning-solid: #B5600F; --danger-solid: #D0383E; --info-solid: #2F6FE0;
    --accent-solid: #96661F;       /* white on it 5:1 */
    --neutral-solid: #636363;      /* Apple's gray 2 (dark), pure grayscale: white icons on it, like the grey tiles in Settings */
    --ink-fill: #3D3D3D; --on-ink-fill: #F5F2EE;  /* 11:1 */

    --fill: rgba(255, 255, 255, .07);
    --fill-2: rgba(255, 255, 255, .11);
    --fill-3: rgba(255, 255, 255, .17);
    --line: rgba(255, 247, 238, .12);
    --line-strong: rgba(255, 247, 238, .22);

    --tint: #A88BFF;               /* 6.3:1 on --surface */
    --tint-hover: #C2AEFF;
    --tint-soft: rgba(140, 105, 255, .2);
    --focus: rgba(168, 139, 255, .6);

    --accent: #D9A659;
    --accent-soft: rgba(217, 166, 89, .18);
    --accent-ink: #EBC27E;

    --success: #4CD787; --success-soft: rgba(76, 215, 135, .15);
    --warning: #FFA552; --warning-soft: rgba(255, 165, 82, .16);
    --danger: #FF6B6E;  --danger-soft: rgba(255, 107, 110, .15);
    --info: #6CB1FF;    --info-soft: rgba(108, 177, 255, .15);

    --kid: #B497FF;  --kid-soft: rgba(150, 110, 240, .2);
    --expert: #E8B567; --expert-soft: rgba(201, 149, 74, .2);

    --seq-1: #2A2A2A; --seq-2: #3D3D3D; --seq-3: #6E5A40; --seq-4: #C9954A; --seq-5: #DDB06A; --seq-6: #F0CE8E;

    --cat-1: #F5862A; --cat-1-ink: #FFAD66; --cat-1-soft: rgba(245, 134, 42, .2);
    --cat-2: #F0548A; --cat-2-ink: #FF85AE; --cat-2-soft: rgba(240, 84, 138, .2);
    --cat-3: #34B565; --cat-3-ink: #5FD68B; --cat-3-soft: rgba(52, 181, 101, .2);
    --cat-4: #3D85F0; --cat-4-ink: #7DB3FF; --cat-4-soft: rgba(61, 133, 240, .2);
    --cat-5: #A962E6; --cat-5-ink: #D1A3F7; --cat-5-soft: rgba(169, 98, 230, .22);
    --cat-6: #1BB3B0; --cat-6-ink: #4FD8D4; --cat-6-soft: rgba(27, 179, 176, .2);
    --cat-7: #77819A; --cat-7-ink: #B7BFCD; --cat-7-soft: rgba(119, 129, 154, .24);
    --cat-8: #D49A30; --cat-8-ink: #F0C46C; --cat-8-soft: rgba(212, 154, 48, .2);

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 1px rgba(0, 0, 0, .3);
    --shadow-2: 0 12px 32px -14px rgba(0, 0, 0, .75), 0 2px 6px -2px rgba(0, 0, 0, .4);
    --shadow-3: 0 28px 64px -22px rgba(0, 0, 0, .85), 0 4px 14px -4px rgba(0, 0, 0, .5);
    --overlay-2: rgba(0, 0, 0, .58);

    --glass-bar: rgba(18, 18, 18, .55);
    --glass: rgba(44, 44, 44, .6);
    --glass-thick: rgba(38, 38, 38, .88);
    --glass-clear: rgba(30, 30, 30, .32);
    --glass-grey: rgba(26, 26, 26, .8);
    --glass-grey-deep: rgba(40, 40, 40, .82);
    --glass-sheen: radial-gradient(130% 160% at 14% -30%, rgba(255, 255, 255, .09), rgba(255, 255, 255, 0) 58%);
    --glass-rim: inset 0 1px 0 rgba(255, 255, 255, .13), inset 0 -1px 0 rgba(0, 0, 0, .4), inset 0 0 0 1px rgba(255, 255, 255, .08);
    --glass-lift: 0 12px 36px -14px rgba(0, 0, 0, .7), 0 1px 3px rgba(0, 0, 0, .45);
    --glass-edge: 0 1px 0 rgba(255, 255, 255, .07), 0 14px 28px -22px rgba(0, 0, 0, .85);
    --glass-card: linear-gradient(160deg, rgba(50, 50, 50, .9) 0%, rgba(36, 36, 36, .86) 46%, rgba(28, 28, 28, .84) 100%);
    --glass-card-thick: linear-gradient(160deg, rgba(58, 58, 58, .96) 0%, rgba(44, 44, 44, .94) 50%, rgba(36, 36, 36, .94) 100%);
    --glass-card-rim: inset 0 1px 0 rgba(255, 255, 255, .14), inset 1px 0 0 rgba(255, 255, 255, .05), inset -1px 0 0 rgba(255, 255, 255, .03), inset 0 -1px 0 rgba(0, 0, 0, .35),
                      inset 0 0 0 1px rgba(255, 255, 255, .07), inset 0 0 26px rgba(255, 255, 255, .025);
    --glass-card-rim-sm: inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 -1px 0 rgba(0, 0, 0, .3), inset 0 0 0 1px rgba(255, 255, 255, .07);
    --glass-card-lift: 0 1px 1px rgba(0, 0, 0, .5), 0 3px 8px -2px rgba(0, 0, 0, .4), 0 20px 38px -24px rgba(0, 0, 0, .85);

    --raised: #424242;
    --raised-a: rgba(255, 255, 255, .13);
    --hover-a: rgba(255, 255, 255, .07);
    --press-a: rgba(255, 255, 255, .11);
    --hi: rgba(255, 255, 255, .15);
    --hi-2: rgba(255, 255, 255, .06);
    --hi-glow: rgba(255, 255, 255, .03);
    --sheet: rgba(255, 255, 255, .06);
    --window-frame: rgba(255, 255, 255, .12);
    --well: rgba(0, 0, 0, .28);
    --well-2: rgba(0, 0, 0, .18);
    --veil: rgba(36, 36, 36, .93);
    --shade: 0, 0, 0;
    --ink-line: 255, 247, 238;
    color-scheme: dark;
  }
}


/* ---------- base ---------- */
[hidden] { display: none !important; } /* hidden always wins over component display rules */
[id] { scroll-margin-top: 4.5rem; } /* anchor jumps land below the sticky top bar */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: var(--fs-body); line-height: 1.55;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { margin: 0; color: var(--text); text-wrap: balance; }
h1 { font-weight: 800; font-size: var(--fs-display); line-height: 1.12; letter-spacing: -.022em; }
h2 { font-weight: 700; font-size: var(--fs-title); line-height: 1.22; letter-spacing: -.014em; }
h3 { font-size: var(--fs-headline); font-weight: 700; line-height: 1.3; }
h4 { font-size: var(--fs-callout); font-weight: 700; line-height: 1.35; }
p { margin: 0; }
figcaption, caption { font-family: var(--font-2); }
a { color: var(--tint); text-decoration: none; }
a:hover { color: var(--tint-hover); text-decoration: underline; text-underline-offset: 3px; }
code, kbd, samp { font-family: var(--font-mono); font-size: .875em; background: var(--fill); padding: .05em .35em; border-radius: var(--r-xs); }
pre { font-family: var(--font-mono); font-size: var(--fs-footnote); background: var(--surface-sunk); border-radius: var(--r-md); padding: var(--sp-4); overflow-x: auto; }
hr { border: 0; border-top: 1px solid var(--line); margin: var(--sp-5) 0; }
img, svg, video { max-width: 100%; }
::selection { background: var(--tint-soft); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--r-xs); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }

/* ---------- text utilities ---------- */
.lb-eyebrow { font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; color: var(--accent-ink); letter-spacing: .02em; }
.lb-eyebrow.cat { color: var(--tc-ink); }
.lb-lede { font-size: 1.125rem; line-height: 1.5; color: var(--text-2); max-width: 42rem; }
.lb-muted { color: var(--text-2); }
.lb-dim { color: var(--text-3); }
.lb-small { font-size: var(--fs-callout); }
.lb-xs { font-size: var(--fs-footnote); }
.lb-num { font-variant-numeric: tabular-nums; }
.lb-ltr { direction: ltr; unicode-bidi: isolate; }
.lb-prose { max-width: 42rem; display: grid; gap: var(--sp-3); }
.lb-prose ul, .lb-prose ol { margin: 0; padding-inline-start: 1.25rem; display: grid; gap: var(--sp-1); }
.lb-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lb-font-2 { font-family: var(--font-2); } /* the secondary font on any element: labels, captions, counts */
.lb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- layout ---------- */
.lb-app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
.lb-main { min-width: 0; display: flex; flex-direction: column; }
.lb-page { width: 100%; max-width: var(--content-w); margin-inline: auto; padding-inline: var(--sp-5); padding-block: var(--sp-5) var(--sp-7); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); align-content: start; }
.lb-section { display: grid; gap: var(--sp-4); min-width: 0; }
.lb-section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--sp-2) var(--sp-4); }
.lb-section-head .lb-meta { font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); }
.lb-grid { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--min, 15rem)), 1fr)); }
.lb-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lb-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.lb-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.lb-stack { display: grid; gap: var(--sp-3); align-content: start; min-width: 0; }
.lb-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); min-width: 0; }
.lb-row.between { justify-content: space-between; }
.lb-spacer { flex: 1; }
@media (max-width: 1000px) { .lb-grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lb-grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .lb-grid.cols-2, .lb-grid.cols-3, .lb-grid.cols-4 { grid-template-columns: minmax(0, 1fr); } .lb-page { padding-inline: var(--sp-4); } }

/* ---------- sidebar navigation ---------- */
.lb-sidebar {
  position: sticky; top: var(--lb-gnav-top, 0px); height: calc(100vh - var(--lb-gnav-top, 0px)); overflow-y: auto; background: var(--sidebar);
  border-inline-end: 1px solid var(--line); padding: var(--sp-4) var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-4);
}
.lb-brand { display: flex; align-items: center; gap: var(--sp-2); padding-inline: var(--sp-2); color: var(--text); text-decoration: none; }
.lb-brand:hover { text-decoration: none; color: var(--text); }
.lb-brand img { height: 2rem; width: auto; }
.lb-brand b { font-weight: 800; font-size: 1.0625rem; letter-spacing: -.01em; }
.lb-brand small { display: block; font-family: var(--font-2); font-size: var(--fs-caption); color: var(--text-3); }
.lb-nav { display: grid; gap: 2px; }
.lb-nav-label { font-family: var(--font-2); font-size: var(--fs-caption); font-weight: 700; color: var(--text-3); padding: var(--sp-3) var(--sp-3) var(--sp-1); letter-spacing: .03em; }
.lb-nav-item {
  display: flex; align-items: center; gap: var(--sp-2); padding: .5rem var(--sp-3); border-radius: var(--r-sm);
  color: var(--text); font-size: var(--fs-callout); font-weight: 500; text-decoration: none; cursor: pointer;
  background: none; border: 0; font-family: var(--font); text-align: start; width: 100%;
}
.lb-nav-item:hover { background: var(--fill); text-decoration: none; color: var(--text); }
.lb-nav-item[aria-current="page"], .lb-nav-item.is-active { background: var(--surface); color: var(--tint); box-shadow: var(--shadow-1); }
.lb-nav-item svg { width: 1.125rem; height: 1.125rem; flex: none; opacity: .8; }
.lb-nav-item .lb-count { margin-inline-start: auto; }
.lb-sidebar-foot { margin-top: auto; display: grid; gap: var(--sp-2); padding-inline: var(--sp-2); font-family: var(--font-2); font-size: var(--fs-caption); color: var(--text-3); }

/* sticky top bar of a page (also the mobile header) */
.lb-topbar {
  position: sticky; top: max(env(safe-area-inset-top, 0px), var(--lb-gnav-top, 0px)); z-index: 20; background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
  border-bottom: 1px solid var(--line);
}
.lb-topbar-in { max-width: var(--content-w); margin-inline: auto; padding-inline: var(--sp-5); min-height: 3.5rem; display: flex; align-items: center; gap: var(--sp-3); }
.lb-topbar h1 { font-size: 1.125rem; font-weight: 700; letter-spacing: -.01em; }
.lb-menu-btn, .lb-btn.lb-menu-btn { display: none; }
@media (max-width: 860px) {
  .lb-app { grid-template-columns: minmax(0, 1fr); }
  .lb-sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; width: min(85vw, 18rem); z-index: 40; transform: translateX(100%); visibility: hidden; transition: transform .2s ease, visibility 0s linear .2s; }
  [dir="ltr"] .lb-sidebar { transform: translateX(-100%); }
  .lb-sidebar.is-open { transform: none; visibility: visible; box-shadow: var(--shadow-3); transition: transform .2s ease; }
  .lb-menu-btn, .lb-btn.lb-menu-btn { display: inline-flex; }
  .lb-topbar-in { padding-inline: var(--sp-4); }
}
.lb-scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 35; }

/* horizontal section nav (pages without a sidebar) */
.lb-toc { display: flex; gap: var(--sp-1); overflow-x: auto; scrollbar-width: none; min-width: 0; }
.lb-toc::-webkit-scrollbar { display: none; }
.lb-toc a { flex: none; padding: .35rem .75rem; border-radius: var(--r-pill); color: var(--text-2); font-size: var(--fs-callout); font-weight: 500; }
.lb-toc a:hover { background: var(--fill); color: var(--text); text-decoration: none; }
.lb-toc a[aria-current="true"], .lb-toc a[aria-current="page"], .lb-toc a.is-active { background: var(--tint-soft); color: var(--tint); }

/* ---------- surfaces ---------- */
.lb-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-4) var(--sp-5); min-width: 0; display: grid; gap: var(--sp-3); align-content: start; }
.lb-card.is-flush { padding: 0; overflow: hidden; }
.lb-card.is-quiet { background: var(--surface-2); border-color: transparent; }
.lb-card.is-raised { box-shadow: var(--shadow-2); }
.lb-card.is-accent { border-color: var(--accent); box-shadow: 0 14px 40px -26px var(--accent); }
a.lb-card { color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s; }
a.lb-card:hover { border-color: var(--tint); box-shadow: var(--shadow-2); text-decoration: none; color: inherit; }
.lb-card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.lb-card-title { font-size: var(--fs-callout); font-weight: 600; color: var(--text-2); }

/* Apple inset grouped list */
.lb-group { background: var(--surface); border-radius: var(--r-md); border: 1px solid var(--line); overflow: hidden; }
.lb-group > * + * { border-top: 1px solid var(--line); }
.lb-group-row { display: flex; align-items: center; gap: var(--sp-3); padding: .75rem var(--sp-4); min-height: 3rem; color: inherit; }
a.lb-group-row:hover { background: var(--fill); text-decoration: none; color: inherit; }
.lb-group-row .lb-meta { margin-inline-start: auto; color: var(--text-3); font-family: var(--font-2); font-size: var(--fs-footnote); }

/* ---------- data display ---------- */
.lb-stat { display: grid; gap: var(--sp-1); align-content: start; min-width: 0; }
.lb-stat > * { min-width: 0; max-width: 100%; } /* long content wraps instead of widening the card */
.lb-stat-label { font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); font-weight: 600; }
.lb-stat-value { font-size: var(--fs-num); line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.lb-stat-value small { font-size: var(--fs-callout); font-weight: 500; color: var(--text-2); margin-inline-start: var(--sp-2); unicode-bidi: isolate; } /* isolate: keeps "36" and "1 פורסמו" from joining into 361 on RTL pages */
.lb-stat-foot { font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-2); }
.lb-delta { font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; font-variant-numeric: tabular-nums; }
.lb-delta.up { color: var(--success); } .lb-delta.down { color: var(--danger); }

.lb-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.lb-table { width: 100%; border-collapse: collapse; font-size: var(--fs-callout); }
.lb-table th, .lb-table td { text-align: start; padding: .6rem var(--sp-3); border-bottom: 1px solid var(--line); vertical-align: middle; }
.lb-table th { font-family: var(--font-2); font-weight: 600; font-size: var(--fs-footnote); color: var(--text-3); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
.lb-table tr:last-child td { border-bottom: 0; }
.lb-table tbody tr:hover td { background: var(--fill); }
.lb-table td.num, .lb-table th.num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lb-table th[aria-sort] { cursor: pointer; }
/* is-roomy: a table people work in all day (the creator map's books tab): larger header labels, taller rows */
.lb-table.is-roomy th { font-size: var(--fs-callout); font-weight: 700; color: var(--text-2); }
.lb-table.is-roomy td { padding-block: .65rem; }

.lb-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-3); }
.lb-list > li { display: grid; gap: 2px; min-width: 0; }
.lb-list .lb-meta { font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); }
.lb-kv { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--sp-2) var(--sp-4); font-size: var(--fs-callout); }
.lb-kv dt { font-family: var(--font-2); font-weight: 600; color: var(--text-3); } .lb-kv dd { margin: 0; }

.lb-bar { height: .4rem; border-radius: var(--r-pill); background: var(--fill-2); overflow: hidden; }
.lb-bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.lb-bar.is-tint > i { background: var(--tint); }
.lb-hbars { display: grid; gap: var(--sp-2); }
.lb-hbar { display: grid; grid-template-columns: minmax(5rem, 38%) minmax(0, 1fr) 2.5rem; gap: var(--sp-3); align-items: center; font-size: var(--fs-callout); }
.lb-hbar .track { height: .625rem; background: var(--fill-2); border-radius: var(--r-xs); }
.lb-hbar .track > i { display: block; height: 100%; background: var(--seq-4); border-radius: inherit; }
.lb-hbar:hover .track > i { background: var(--accent-ink); }
.lb-hbar .v { font-family: var(--font-2); font-weight: 600; font-size: var(--fs-footnote); color: var(--text-2); font-variant-numeric: tabular-nums; text-align: end; }
svg.lb-spark { width: 100%; height: 2.75rem; display: block; overflow: visible; }
svg.lb-spark .grid { stroke: var(--line); }
svg.lb-spark .area { fill: var(--accent-soft); }
svg.lb-spark .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.lb-spark .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }

/* stacked status bar (pipeline stages) */
.lb-stages { display: flex; height: .875rem; gap: 2px; border-radius: var(--r-xs); overflow: hidden; background: var(--fill); }
.lb-stages > i { display: block; height: 100%; }
.lb-legend { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-2); }
.lb-legend > span { display: inline-flex; align-items: center; gap: var(--sp-2); }
.lb-legend b { width: .625rem; height: .625rem; border-radius: 3px; display: inline-block; }

/* metric tiles, "number cubes" (Yarin, 05 Nov 2026, from the creator map's books tab): a row of counts a reader scans first, instead of a
   sentence of figures. A cube: a label with an icon tile, a big tabular number with an optional lb-delta, an optional foot
   and an optional lb-bar. Colour: put the metric's category on the cube (lb-cat-N from categories.json, one hue per metric,
   the same wherever that metric appears) or is-ok for a status count (success); say what waits with lb-wait in the foot.
   A cube without a number is is-empty and says why (lb-none). Columns: 3, or cols-6 for six across on wide screens; two on
   phones. sm: the compact size for a table row or a card (three across).
   <dl class="lb-metrics"><div class="lb-metric lb-cat-4"><dt class="lb-metric-label"><span class="lb-tile is-soft">svg</span>צפיות</dt>
   <dd class="lb-metric-value">7,169<i class="lb-delta up">+164</i></dd><dd class="lb-metric-foot">ב-3 פוסטים</dd></div></dl> */
.lb-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); margin: 0; }
@media (min-width: 1200px) { .lb-metrics.cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@media (max-width: 560px) { .lb-metrics:not(.sm) { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.lb-metric { --tc: var(--text-3); --tc-ink: var(--text); --tc-soft: var(--fill); display: grid; gap: .45rem; align-content: start; min-width: 0; margin: 0;
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-lg); background: color-mix(in srgb, var(--tc) 7%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 32%, transparent); }
.lb-metric.is-ok { --tc: var(--success); --tc-ink: var(--success); --tc-soft: var(--success-soft); }
.lb-metric.is-warn { --tc: var(--warning); --tc-ink: var(--warning); --tc-soft: var(--warning-soft); } /* something waits for Yarin (HQ home, 8 Nov 2026) */
.lb-metric.is-empty { background: var(--fill); box-shadow: none; }
.lb-metric-label { display: flex; align-items: center; gap: .5rem; margin: 0; font-family: var(--font-2); font-size: var(--fs-callout); font-weight: 700; line-height: 1.2; color: var(--tc-ink); }
.lb-metric-label > svg { width: 1rem; height: 1rem; flex: none; color: var(--tc); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lb-metric-label > .lb-tile { width: 2.1rem; height: 2.1rem; border-radius: .6rem; }
.lb-metric-label > .lb-tile svg { width: 1.2rem; height: 1.2rem; }
.lb-metric-value { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .5rem; margin: 0; font-size: var(--fs-num); line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--tc-ink); }
.lb-metric-value .lb-delta { direction: ltr; unicode-bidi: isolate; font-style: normal; } /* +164 and -1 keep their sign in front on Hebrew pages */
.lb-metric-value .lb-none { font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 600; letter-spacing: 0; color: var(--text-3); }
.lb-metric-foot { margin: 0; font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 600; color: var(--text-2); }
.lb-metric > * { min-width: 0; margin-inline: 0; }
.lb-metric > .lb-bar { margin-top: .15rem; height: .45rem; }
.lb-metric.is-empty .lb-metric-label { color: var(--text-3); }
.lb-metrics.sm { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .4rem; }
.lb-metrics.sm .lb-metric { padding: .45rem .6rem .5rem; gap: .15rem; border-radius: var(--r-md); }
.lb-metrics.sm .lb-metric-label { font-size: var(--fs-footnote); gap: .3rem; }
.lb-metrics.sm .lb-metric-value { font-size: var(--fs-title); gap: 0 .35rem; }
.lb-metrics.sm .lb-delta { font-size: var(--fs-caption); }
.lb-metrics.sm .lb-metric { align-content: space-between; } /* labels of two lines still leave the numbers on one line */
.lb-metrics.sm .lb-metric-label { align-items: flex-start; line-height: 1.25; }
.lb-metrics.sm .lb-metric-label > svg { margin-top: .1rem; }
/* rating (the creator card's six numbers, 05 Nov 2026): a number rated against the rest is is-ok (good, success) or is-bad
   (weak, danger), neither in the middle. lb-metric-mark is the round arrow at the tile's top end (up, down or mid), with the
   rating in words in its aria-label and in the tile's title. A rating is status, so never a category hue. */
.lb-metric { position: relative; }
.lb-metric.is-bad { --tc: var(--danger); --tc-ink: var(--danger); --tc-soft: var(--danger-soft); }
.lb-metric-mark { position: absolute; top: .45rem; inset-inline-end: .45rem; width: 1.375rem; height: 1.375rem; padding: .2rem; box-sizing: border-box; border-radius: 50%;
  color: var(--text-3); background: var(--fill-2); fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
.lb-metric.is-ok > .lb-metric-mark, .lb-metric.is-bad > .lb-metric-mark { color: var(--tc); background: var(--tc-soft); }
.lb-metric:has(> .lb-metric-mark) > .lb-metric-label { padding-inline-end: 1.6rem; }
.lb-metric:hover > .lb-metric-mark.up { transform: translateY(-3px); }
.lb-metric:hover > .lb-metric-mark.down { transform: translateY(3px); }
.lb-metric:hover > .lb-metric-mark.mid { transform: scaleX(1.3); }
@media (prefers-reduced-motion: reduce) { .lb-metric:hover > .lb-metric-mark { transform: none; } }
/* progress of "x of y" where the rest is waiting: done in success on a warning-soft track */
.lb-bar.is-progress { background: var(--warning-soft); }
.lb-bar.is-progress > i { background: var(--success); }
/* a waiting count inside a foot or a line ("4 בדרך", "נבדק לפני 3 ימים"): amber and bold, always with its word */
.lb-wait { color: var(--warning); font-weight: 700; }

/* ---------- status ---------- */
.lb-chip {
  display: inline-flex; align-items: center; gap: .375rem; padding: .15rem .6rem; border-radius: var(--r-pill);
  font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 600; line-height: 1.5; white-space: nowrap;
  background: var(--fill); color: var(--text-2);
}
.lb-chip.tint { background: var(--tint-soft); color: var(--tint); }
.lb-chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.lb-chip.success { background: var(--success-soft); color: var(--success); }
.lb-chip.warning { background: var(--warning-soft); color: var(--warning); }
.lb-chip.danger { background: var(--danger-soft); color: var(--danger); }
.lb-chip.info { background: var(--info-soft); color: var(--info); }
.lb-chip.kid { background: var(--kid-soft); color: var(--kid); }
.lb-chip.expert { background: var(--expert-soft); color: var(--expert); }
.lb-chip.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.lb-chip.wrap { white-space: normal; line-height: 1.35; padding-block: .3rem; border-radius: var(--r-sm); justify-self: start; } /* a sentence-length status */
.lb-dot { width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; flex: none; }
.lb-dot.live { animation: lb-pulse 2.4s infinite; }
@keyframes lb-pulse { 0% { box-shadow: 0 0 0 0 var(--success-soft); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.lb-count { display: inline-grid; place-items: center; min-width: 1.4rem; height: 1.4rem; padding-inline: .4rem; border-radius: var(--r-pill); background: var(--fill-2); color: var(--text-2); font-family: var(--font-2); font-size: var(--fs-caption); font-weight: 700; font-variant-numeric: tabular-nums; }
.lb-count.is-alert { background: var(--danger-solid); color: var(--text-on-tint); }
.lb-count.is-tint { background: var(--tint-solid); color: var(--text-on-tint); }

/* alert row: severity as a tinted pill + tinted ground */
.lb-alerts { display: grid; gap: var(--sp-2); }
.lb-alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; padding: .6rem var(--sp-3); border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); font-size: var(--fs-callout); }
.lb-alert.crit { background: var(--danger-soft); border-color: transparent; }
.lb-alert.warn { background: var(--warning-soft); border-color: transparent; }
.lb-alert .lb-alert-text { min-width: 0; }
.lb-alert a { font-size: var(--fs-footnote); white-space: nowrap; }

/* ---------- categories ----------
   A page with 3 to 8 stable categories that a reader scans or filters by gives each one a class from
   shared/design/categories.json: lb-cat-1 ... lb-cat-8 (lb-cat-0 for "none of them"). The class only sets
   --tc (base), --tc-ink (text) and --tc-soft (ground); the pieces below read them, so one class on a row,
   card or nav item colours its tile, chip, ID, bar and edge the same way. Status stays on the status chips.
   Named per page too: design.head() adds .lb-<set>-<key> classes (.lb-ws-creators) generated from categories.json. */
.lb-cat-0 { --tc: var(--neutral-solid); --tc-ink: var(--text); --tc-soft: var(--fill); }
.lb-cat-1 { --tc: var(--cat-1); --tc-ink: var(--cat-1-ink); --tc-soft: var(--cat-1-soft); }
.lb-cat-2 { --tc: var(--cat-2); --tc-ink: var(--cat-2-ink); --tc-soft: var(--cat-2-soft); }
.lb-cat-3 { --tc: var(--cat-3); --tc-ink: var(--cat-3-ink); --tc-soft: var(--cat-3-soft); }
.lb-cat-4 { --tc: var(--cat-4); --tc-ink: var(--cat-4-ink); --tc-soft: var(--cat-4-soft); }
.lb-cat-5 { --tc: var(--cat-5); --tc-ink: var(--cat-5-ink); --tc-soft: var(--cat-5-soft); }
.lb-cat-6 { --tc: var(--cat-6); --tc-ink: var(--cat-6-ink); --tc-soft: var(--cat-6-soft); }
.lb-cat-7 { --tc: var(--cat-7); --tc-ink: var(--cat-7-ink); --tc-soft: var(--cat-7-soft); }
.lb-cat-8 { --tc: var(--cat-8); --tc-ink: var(--cat-8-ink); --tc-soft: var(--cat-8-soft); }

/* tile: a rounded square with a line icon, the category's mark in nav, card and page headers. Icons only:
   a letter or number goes on .is-soft (ink on soft) because white text fails on most bases. */
.lb-tile { display: inline-grid; place-items: center; width: 1.65rem; height: 1.65rem; border-radius: .45rem; background: var(--tc, var(--tint)); color: var(--text-on-tint); flex: none; font-family: var(--font-2); font-size: var(--fs-caption); font-weight: 700; line-height: 1; }
.lb-tile svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; opacity: 1; }
.lb-tile.is-soft { background: var(--tc-soft, var(--tint-soft)); color: var(--tc-ink, var(--tint)); }
.lb-tile.lg { width: 2.6rem; height: 2.6rem; border-radius: .7rem; font-size: var(--fs-callout); }
.lb-tile.lg svg { width: 1.4rem; height: 1.4rem; }
.lb-tile.xl { width: 3.5rem; height: 3.5rem; border-radius: .9rem; box-shadow: 0 10px 24px -12px var(--tc, var(--tint)); font-size: var(--fs-headline); }
.lb-tile.xl svg { width: 1.9rem; height: 1.9rem; stroke-width: 2; }

/* category chip: lb-chip + cat. The square swatch tells it apart from a status chip (dot and word). */
.lb-chip.cat { background: var(--tc-soft, var(--fill)); color: var(--tc-ink, var(--text-2)); }
.lb-chip.cat::before { content: ""; width: .5rem; height: .5rem; border-radius: 2px; background: var(--tc, var(--text-3)); flex: none; }
.lb-chip.cat.no-swatch::before { content: none; }
button.lb-chip { border: 0; cursor: pointer; font-family: var(--font-2); }
button.lb-chip.cat[aria-pressed="false"] { background: var(--fill); color: var(--text-2); }
button.lb-chip.cat[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--tc); }

/* ID chip: a short code (H1, kid-2, 3) in the category's ink on its soft ground; left to right inside Hebrew. */
.lb-pid {
  display: inline-flex; align-items: center; justify-content: center; min-width: 2.1rem; padding: .05rem .4rem; border-radius: .4rem;
  font-family: var(--font-2); font-size: var(--fs-caption); font-weight: 700; letter-spacing: .02em; line-height: 1.4; white-space: nowrap;
  background: var(--tc-soft, var(--fill)); color: var(--tc-ink, var(--text)); text-decoration: none; font-variant-numeric: tabular-nums;
  direction: ltr; unicode-bidi: isolate;
}
a.lb-pid:hover { background: var(--tc-ink, var(--tint)); color: var(--text-on-tint); text-decoration: none; }
.lb-pid.in { min-width: 0; padding: 0 .32rem; font-size: .74em; vertical-align: .08em; }

/* swatch for legends and stacked bars: <b class="lb-swatch lb-cat-3"></b> */
.lb-swatch { background: var(--tc); }
.lb-legend .lb-swatch { width: .625rem; height: .625rem; border-radius: 3px; display: inline-block; flex: none; }
/* card tint, bars and eyebrow in the category's colour (never a side stripe: Yarin, 05 Nov 2026) */
.lb-card.is-cat { border-color: color-mix(in srgb, var(--tc) 28%, var(--line)); background: linear-gradient(var(--tc-soft), var(--tc-soft)), var(--surface); }
a.lb-card.is-cat:hover { border-color: var(--tc); }
.lb-bar.is-cat > i, .lb-hbar.is-cat .track > i { background: var(--tc); }
.lb-hbar.is-cat:hover .track > i { background: var(--tc-ink); }

/* sidebar item with a tile and an optional plain count (Apple source list); the current one keeps ink text */
.lb-nav-item > .lb-tile { margin-inline-start: -.15rem; }
.lb-nav-item:has(> .lb-tile)[aria-current="page"] { color: var(--text); font-weight: 700; box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
.lb-nav-item > .lb-nav-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-nav-n { margin-inline-start: auto; font-family: var(--font-2); font-size: var(--fs-caption); font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; }
/* sub-list that opens under the current item, indented */
.lb-nav-sub { display: grid; gap: 1px; min-width: 0; margin-block: .15rem .35rem; margin-inline-start: 1.35rem; padding-inline-start: .7rem; }
.lb-nav-sub a, .lb-nav-sub button {
  display: flex; gap: .5rem; align-items: baseline; min-width: 0; padding: .26rem .5rem; border-radius: .45rem; border: 0; background: none;
  color: var(--text-2); font-family: var(--font); font-size: .875rem; line-height: 1.3; text-align: start; text-decoration: none; cursor: pointer;
}
.lb-nav-sub a:hover, .lb-nav-sub button:hover { background: var(--fill); color: var(--text); text-decoration: none; }
.lb-nav-sub [aria-current="page"], .lb-nav-sub .is-active { background: var(--tc-soft, var(--tint-soft)); color: var(--tc-ink, var(--tint)); font-weight: 700; }
.lb-nav-sub a > span:last-child, .lb-nav-sub button > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-nav-sub .lb-pid { flex: none; }

/* ---------- disclosure ----------
   Secondary detail behind a toggle: <details class="lb-disclosure"><summary>Title <small>one line</small></summary>
   <div class="lb-disclosure-body">...</div></details>. The chevron points forward (left in Hebrew) and turns down when open. */
details.lb-disclosure { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); min-width: 0; }
details.lb-disclosure.is-quiet { background: transparent; border-color: transparent; }
.lb-disclosure > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: var(--sp-3); padding: .8rem var(--sp-4);
  font-weight: 600; font-size: var(--fs-callout); border-radius: var(--r-md); min-width: 0;
}
.lb-disclosure > summary::-webkit-details-marker { display: none; }
.lb-disclosure > summary:hover { background: var(--fill); }
.lb-disclosure > summary > .lb-sum { flex: 1; min-width: 0; }
.lb-disclosure > summary small { display: block; font-family: var(--font-2); font-weight: 500; font-size: var(--fs-footnote); color: var(--text-3); margin-top: .1rem; }
.lb-disclosure > summary::after {
  content: ""; flex: none; margin-inline-start: auto; width: .45rem; height: .45rem; border: solid var(--text-3);
  border-width: 0 2px 2px 0; /* physical sides, turned below */ transform: rotate(-45deg); transition: transform .2s;
}
[dir="rtl"] .lb-disclosure > summary::after { transform: rotate(135deg); }
.lb-disclosure[open] > summary::after { transform: rotate(45deg); } /* same specificity as the rtl rule, so it must stay after it */
.lb-disclosure[open] > summary { border-end-start-radius: 0; border-end-end-radius: 0; border-bottom: 1px solid var(--line); }
details.lb-disclosure.is-quiet[open] > summary { border-bottom-color: transparent; }
.lb-disclosure.is-cat[open] { border-color: color-mix(in srgb, var(--tc) 35%, var(--line)); }
.lb-disclosure.is-cat[open] > summary { background: var(--tc-soft); }
.lb-disclosure-body { padding: var(--sp-4); display: grid; gap: var(--sp-3); min-width: 0; }
.lb-disclosures { display: grid; gap: var(--sp-2); }

/* ---------- controls ---------- */
.lb-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 2.25rem; padding: 0 var(--sp-4); border-radius: var(--r-pill); border: 1px solid transparent;
  font: inherit; font-family: var(--font); font-size: var(--fs-callout); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  background: var(--tint-solid); color: var(--text-on-tint); transition: background .15s, border-color .15s;
}
.lb-btn:hover { background: var(--tint-solid-hover); color: var(--text-on-tint); text-decoration: none; }
.lb-btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line-strong); }
.lb-btn.secondary:hover { border-color: var(--tint); color: var(--tint); background: var(--surface); }
.lb-btn.ghost { background: transparent; color: var(--tint); }
.lb-btn.ghost:hover { background: var(--tint-soft); }
.lb-btn.danger { background: var(--danger-solid); }
.lb-btn.sm { min-height: 1.875rem; padding: 0 var(--sp-3); font-size: var(--fs-footnote); }
.lb-btn.icon { width: 2.25rem; padding: 0; }
.lb-btn.quiet { background: transparent; color: var(--text-3); } /* a low-key action repeated on every row (remove), so it never shouts */
.lb-btn.quiet:hover { background: var(--danger-soft); color: var(--danger); }
.lb-btn:disabled, .lb-btn[aria-disabled="true"] { opacity: .45; cursor: default; }
.lb-btn svg { width: 1.1em; height: 1.1em; }

.lb-segmented { display: inline-flex; padding: 2px; border-radius: var(--r-sm); background: var(--fill-2); gap: 2px; }
.lb-segmented button { border: 0; background: transparent; font: inherit; font-family: var(--font); font-size: var(--fs-footnote); font-weight: 500; color: var(--text-2); padding: .3rem .8rem; border-radius: calc(var(--r-sm) - 2px); cursor: pointer; }
.lb-segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }

.lb-input, .lb-select, .lb-textarea {
  font: inherit; font-family: var(--font); font-size: var(--fs-callout); color: var(--text); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: .45rem .7rem; min-height: 2.25rem; max-width: 100%;
}
.lb-textarea { min-height: 5rem; resize: vertical; width: 100%; line-height: 1.5; }
.lb-input:focus, .lb-select:focus, .lb-textarea:focus { outline: none; border-color: var(--tint); box-shadow: 0 0 0 3px var(--tint-soft); }
.lb-search { position: relative; display: flex; align-items: center; min-width: 0; }
.lb-search .lb-input { width: 100%; padding-inline-start: 2.1rem; border-radius: var(--r-pill); background: var(--fill); border-color: transparent; }
.lb-search svg { position: absolute; inset-inline-start: .7rem; width: 1rem; height: 1rem; color: var(--text-3); pointer-events: none; }
.lb-field { display: grid; gap: var(--sp-1); font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 600; color: var(--text-2); }
/* link field: a short label, the URL (left to right) and an open button, for links typed into a row (a post, a Drive folder).
   Stack them in lb-linkfields. The button shows only when there is a link; an empty span keeps its slot so inputs line up. */
.lb-linkfields { display: grid; gap: .45rem; min-width: 0; }
.lb-linkfield { display: grid; grid-template-columns: 3rem minmax(0, 1fr) 2.2rem; gap: .4rem; align-items: center; min-width: 0; }
.lb-linkfield > :first-child { font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; color: var(--text-2); }
.lb-linkfield .lb-input { min-width: 0; width: 100%; direction: ltr; }
.lb-linkfield > :last-child { justify-self: center; }

.lb-check { display: flex; gap: .6rem; align-items: flex-start; font-size: var(--fs-callout); cursor: pointer; padding: 2px 0; }
.lb-check input { appearance: none; flex: none; width: 1.125rem; height: 1.125rem; margin: .15rem 0 0; border: 1.5px solid var(--line-strong); border-radius: .35rem; display: grid; place-content: center; cursor: pointer; background: var(--surface); }
.lb-check input::after { content: ""; width: .55rem; height: .3rem; border-style: solid; border-color: var(--text-on-tint); border-width: 0 0 2px 2px; /* physical sides: the tick must not mirror in RTL */ transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.lb-check input:checked { background: var(--tint-solid); border-color: var(--tint-solid); }
.lb-check input:checked::after { opacity: 1; }
.lb-check input:checked + span { color: var(--text-3); text-decoration: line-through; }
.lb-check input:disabled { cursor: default; }

.lb-switch { appearance: none; width: 2.6rem; height: 1.5rem; border-radius: var(--r-pill); background: var(--fill-3); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.lb-switch::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-1); transition: inset-inline-start .15s; }
.lb-switch:checked { background: var(--success); }
.lb-switch:checked::after { inset-inline-start: calc(100% - 1.25rem - 2px); }
/* toggle with its state in words: a switch and a status chip in one label, for a done or waiting step in a table row
   (success chip when on; warning chip when the step is now waiting; a neutral chip when it is not due yet) */
.lb-toggle { display: inline-flex; align-items: center; gap: .5rem; cursor: pointer; white-space: nowrap; }
.lb-toggle .lb-chip { font-weight: 700; }

.lb-tabs { display: flex; gap: var(--sp-1); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.lb-tabs button, .lb-tabs a { flex: none; border: 0; background: none; font: inherit; font-family: var(--font); font-size: var(--fs-callout); font-weight: 500; color: var(--text-2); padding: .55rem .9rem; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.lb-tabs [aria-selected="true"], .lb-tabs [aria-current="page"], .lb-tabs .is-active { color: var(--tint); border-bottom-color: var(--tint); }
.lb-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }

/* ---------- feedback ---------- */
.lb-empty { padding: var(--sp-5); border: 1px dashed var(--line-strong); border-radius: var(--r-md); color: var(--text-2); font-size: var(--fs-callout); text-align: center; }
.lb-note { font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); line-height: 1.5; }
.lb-callout { display: grid; gap: var(--sp-1); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); background: var(--accent-soft); color: var(--text); font-size: var(--fs-callout); }
.lb-callout.info { background: var(--info-soft); }
.lb-toast { position: fixed; inset-block-end: calc(var(--sp-5) + env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--bg); padding: .6rem 1rem; border-radius: var(--r-pill); font-size: var(--fs-callout); box-shadow: var(--shadow-3); }
[dir="rtl"] .lb-toast { transform: translateX(50%); }
.lb-skeleton { background: linear-gradient(90deg, var(--fill) 25%, var(--fill-2) 50%, var(--fill) 75%); background-size: 200% 100%; animation: lb-shimmer 1.4s infinite; border-radius: var(--r-xs); min-height: 1em; }
@keyframes lb-shimmer { to { background-position: -200% 0; } }

/* ---------- overlays ---------- */
.lb-drawer { position: fixed; inset-block: 0; inset-inline-end: 0; width: min(100%, 34rem); background: var(--surface); z-index: 50; box-shadow: var(--shadow-3); display: flex; flex-direction: column; overflow: hidden; }
.lb-drawer-head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--line); }
.lb-drawer-body { padding: var(--sp-5); overflow-y: auto; display: grid; gap: var(--sp-4); align-content: start; }
.lb-modal { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--sp-4); z-index: 50; }
.lb-modal > .lb-card { width: min(100%, 32rem); max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-3); }

/* ---------- shared page patterns (05 Nov 2026) ----------
   Pieces that two or more pages had each built on their own (Yarin: "add everything to the design system"). One component
   each now; pages use these instead of their own copies. Tokens only, logical properties, light and dark from the same tokens. */

/* top bar brand: the logo and name at the start of an lb-topbar (the sidebar lb-brand, sized for a bar). is-stacked puts the
   small line (a gold eyebrow) above the name: <a class="lb-brand is-stacked"><img><span><small>LumeBook</small><b>Page</b></span></a> */
.lb-topbar .lb-brand { padding-inline: 0; min-width: 0; flex: 0 1 auto; }
.lb-topbar .lb-brand img { height: 1.75rem; border-radius: var(--r-xs); flex: none; }
.lb-brand > span { display: grid; min-width: 0; }
.lb-topbar .lb-brand b { font-size: 1.0625rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-brand.is-stacked small { order: -1; color: var(--accent-ink); font-weight: 700; line-height: 1.2; }
/* top bar with section pills (lb-topbar has-toc): under 980px the lb-toc takes its own full-width row under the brand;
   wider, the pills take the free room and the brand keeps its name. */
@media (min-width: 981px) { .lb-topbar.has-toc .lb-toc { flex: 1 1 0; } .lb-topbar.has-toc .lb-brand { flex: none; } }
@media (max-width: 980px) {
  .lb-topbar.has-toc .lb-topbar-in { flex-wrap: wrap; row-gap: 0; padding-block-start: var(--sp-2); }
  .lb-topbar.has-toc .lb-toc { order: 10; flex-basis: calc(100% + 2 * var(--sp-4)); margin-inline: calc(var(--sp-4) * -1); padding: var(--sp-1) var(--sp-4) var(--sp-2); }
  body:has(.lb-topbar.has-toc) [id] { scroll-margin-top: 7rem; }
}

/* hero: the page's opening block. lb-eyebrow, h1, lb-lede, then an lb-hero-meta row of chips or dates. has-media adds a
   picture or demo column (lb-hero-text + any element) that drops under the text on a phone. */
.lb-hero { display: grid; gap: var(--sp-3); padding-block: var(--sp-4) var(--sp-2); min-width: 0; }
.lb-hero h1 { font-size: clamp(1.9rem, 4.6vw, 3rem); line-height: 1.08; letter-spacing: -.02em; }
.lb-hero > h2, .lb-hero-text > h2 { font-size: clamp(1.5rem, 3.2vw, 2.1rem); line-height: 1.12; letter-spacing: -.015em; } /* a view title in an app page */
.lb-hero .lb-lede { max-width: 46rem; }
.lb-hero > .lb-chip, .lb-hero-text > .lb-chip { justify-self: start; }
.lb-hero-text { display: grid; gap: var(--sp-3); min-width: 0; align-content: start; }
.lb-hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); }
.lb-hero.has-media { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: center; gap: var(--sp-5); }
@media (max-width: 760px) { .lb-hero.has-media { grid-template-columns: minmax(0, 1fr); } }

/* number disc: a round step or rank number. Gold soft by default; tint, solid (brand gold with ink), quiet, cat (with an
   lb-cat-N class); sm and lg sizes. ol.lb-steps numbers its items with the same disc: <ol class="lb-steps"><li>...</li></ol>. */
.lb-disc, ol.lb-steps > li::before {
  display: inline-grid; place-items: center; flex: none; width: 2rem; height: 2rem; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent-ink); font-family: var(--font-2); font-size: var(--fs-footnote);
  font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1;
}
.lb-disc.sm { width: 1.6rem; height: 1.6rem; font-size: var(--fs-caption); }
.lb-disc.lg { width: 2.5rem; height: 2.5rem; font-size: var(--fs-callout); }
.lb-disc.tint, ol.lb-steps.tint > li::before { background: var(--tint-soft); color: var(--tint); }
.lb-disc.solid, ol.lb-steps.solid > li::before { background: var(--lb-gold); color: var(--lb-ink); }
.lb-disc.quiet, ol.lb-steps.quiet > li::before { background: var(--fill-2); color: var(--text-2); }
.lb-disc.cat { background: var(--tc-soft); color: var(--tc-ink); }
.lb-disc.warning { background: var(--warning-soft); color: var(--warning); }
ol.lb-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-3); counter-reset: lb-step; }
ol.lb-steps > li { counter-increment: lb-step; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: var(--sp-3); align-items: start; min-width: 0; }
ol.lb-steps > li::before { content: counter(lb-step); }
ol.lb-steps > li > * { grid-column: 2; min-width: 0; }

/* vertical timeline: a list on a rail. Each li starts with a marker (an lb-disc, or an empty lb-disc sm) and its content. */
.lb-timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-4); }
.lb-timeline > li { position: relative; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: var(--sp-3); align-items: start; min-width: 0; }
.lb-timeline > li > :first-child { justify-self: center; position: relative; z-index: 1; }
.lb-timeline > li::before { content: ""; position: absolute; inset-inline-start: calc(1rem - 1px); top: 1.5rem; bottom: calc(var(--sp-4) * -1); width: 2px; background: var(--line); }
.lb-timeline > li:last-child::before { display: none; }
.lb-timeline-time { font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; color: var(--accent-ink); font-variant-numeric: tabular-nums; }

/* text block: ready-to-paste text (a caption, a DM, a script, a command), kept as written. is-code is a left-to-right
   monospace command; is-boxed adds the hairline. lb-copy puts it beside its copy button (is-below: the button under it). */
.lb-textblock { margin: 0; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); background: var(--surface-2); color: var(--text); font-family: var(--font); font-size: var(--fs-callout); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.lb-textblock.is-code { direction: ltr; text-align: left; font-family: var(--font-mono); font-size: var(--fs-footnote); background: var(--surface-sunk); }
.lb-textblock.is-boxed { background: var(--surface); border: 1px solid var(--line); }
.lb-copy { display: flex; align-items: flex-start; gap: var(--sp-2); min-width: 0; }
.lb-copy > .lb-textblock { flex: 1; }
.lb-copy > .lb-btn { flex: none; }
.lb-copy.is-below { flex-direction: column; align-items: stretch; }
.lb-copy.is-below > .lb-btn { align-self: flex-end; }

/* scroller: a sideways swipe row (reels, slides, examples). Set --item for the item width; snap snaps each item to the
   start (snap center: to the middle); bleed runs it edge to edge on a phone. lb-dots under it shows the position. */
.lb-scroller { --item: 16rem; display: grid; grid-auto-flow: column; grid-auto-columns: var(--item); gap: var(--sp-3); overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding-block-end: 2px; min-width: 0; }
.lb-scroller::-webkit-scrollbar { display: none; }
.lb-scroller.snap { scroll-snap-type: x mandatory; }
.lb-scroller.snap > * { scroll-snap-align: start; }
.lb-scroller.snap.center > * { scroll-snap-align: center; }
@media (max-width: 640px) {
  .lb-scroller.bleed { margin-inline: calc(var(--sp-4) * -1); padding-inline: var(--sp-4); scroll-padding-inline: var(--sp-4); }
}
.lb-dots { display: flex; justify-content: center; gap: 6px; }
.lb-dots > i { width: 6px; height: 6px; border-radius: 3px; background: var(--fill-3); transition: width .2s, background .2s; }
.lb-dots > i.is-on { width: 16px; background: var(--text); }

/* media card: a poster (9:16 by default; is-4x5, is-1x1, is-16x9) with a title and a meta line; is-side puts the poster
   beside the text. lb-media-play is the round play mark over a poster. */
.lb-media { display: grid; gap: var(--sp-2); align-content: start; min-width: 0; color: inherit; }
a.lb-media:hover { text-decoration: none; color: inherit; }
a.lb-media:hover .lb-media-frame { box-shadow: var(--shadow-2); }
.lb-media-frame { --ratio: 9 / 16; position: relative; aspect-ratio: var(--ratio); border-radius: var(--r-md); overflow: hidden; background: var(--lb-ink); transition: box-shadow .15s; }
.lb-media-frame.is-4x5 { --ratio: 4 / 5; }
.lb-media-frame.is-1x1 { --ratio: 1; }
.lb-media-frame.is-16x9 { --ratio: 16 / 9; }
.lb-media-frame > img, .lb-media-frame > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lb-media-play { position: absolute; inset: 0; margin: auto; width: 2.75rem; height: 2.75rem; border-radius: 50%; display: grid; place-items: center; background: var(--overlay); color: var(--text-on-tint); pointer-events: none; }
.lb-media-play svg { width: 1.1rem; height: 1.1rem; fill: currentColor; }
.lb-media-body { display: grid; gap: 2px; min-width: 0; }
.lb-media-title { font-weight: 600; font-size: var(--fs-callout); line-height: 1.35; }
.lb-media-meta { font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); }
.lb-media.is-side { grid-template-columns: 5.5rem minmax(0, 1fr); align-items: start; gap: var(--sp-3); }

/* post preview: a mock of a social post (avatar, name, text, media) for showing how a caption or an ad will read. */
.lb-post { display: grid; gap: var(--sp-2); padding: var(--sp-3); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); min-width: 0; }
.lb-post-head { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.lb-post-avatar { width: 2rem; height: 2rem; border-radius: 50%; flex: none; object-fit: cover; background: var(--fill-2); }
.lb-post-name { display: grid; min-width: 0; font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; line-height: 1.25; }
.lb-post-name small { font-weight: 500; font-size: var(--fs-caption); color: var(--text-3); }
.lb-post-text { font-size: var(--fs-callout); white-space: pre-line; overflow-wrap: anywhere; }
.lb-post .lb-media-frame { border-radius: var(--r-sm); }

/* pair: two boxes side by side to compare. Mark each box yes / no (do and don't) or was / now (before and after); its
   lb-pair-label takes the colour. One column on a phone. */
.lb-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
.lb-pair > * { display: grid; gap: var(--sp-2); align-content: start; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.lb-pair-label { font-family: var(--font-2); font-size: var(--fs-footnote); font-weight: 700; color: var(--text-3); }
.lb-pair > .yes .lb-pair-label { color: var(--success); }
.lb-pair > .no .lb-pair-label { color: var(--danger); }
.lb-pair > .now .lb-pair-label { color: var(--accent-ink); }
.lb-pair > .was { background: var(--surface-2); border-color: transparent; color: var(--text-2); }
@media (max-width: 560px) { .lb-pair { grid-template-columns: minmax(0, 1fr); } }

/* key-value list, stacked: lb-kv stack drops to one column on a phone; tight is the smaller variant for side panels. */
.lb-kv.tight { gap: var(--sp-1) var(--sp-3); font-size: var(--fs-footnote); }
@media (max-width: 640px) {
  .lb-kv.stack { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .lb-kv.stack dd + dt { margin-top: var(--sp-2); }
}

/* table modifiers: top aligns cells to the top; mid (40rem) and wide (56rem) set a minimum width so lb-table-wrap scrolls
   instead of squeezing; is-stack turns each row into a card on a phone, labelled from data-label on every td. */
.lb-table.top td { vertical-align: top; }
.lb-table.mid { min-width: 40rem; }
.lb-table.wide { min-width: 56rem; }
@media (max-width: 640px) {
  .lb-table.is-stack { min-width: 0; }
  .lb-table.is-stack, .lb-table.is-stack tbody, .lb-table.is-stack tr, .lb-table.is-stack td { display: block; width: 100%; }
  .lb-table.is-stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .lb-table.is-stack tr { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); }
  .lb-table.is-stack tr:last-child { border-bottom: 0; }
  .lb-table.is-stack td { border: 0; padding: 2px 0; text-align: start; white-space: normal; }
  .lb-table.is-stack td[data-label]::before { content: attr(data-label); display: block; font-family: var(--font-2); font-size: var(--fs-caption); font-weight: 600; color: var(--text-3); }
  .lb-table.is-stack tbody tr:hover td { background: none; }
}

/* callout states: success, warning and danger next to the gold default and info. has-icon puts a line icon in its own
   column at the start. */
.lb-callout.success { background: var(--success-soft); }
.lb-callout.warning { background: var(--warning-soft); }
.lb-callout.danger { background: var(--danger-soft); }
.lb-callout.has-icon { grid-template-columns: auto minmax(0, 1fr); column-gap: var(--sp-3); align-items: start; }
.lb-callout.has-icon > svg { grid-row: span 4; width: 1.2rem; height: 1.2rem; margin-top: .15rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--accent-ink); }
.lb-callout.info > svg { color: var(--info); }
.lb-callout.success > svg { color: var(--success); }
.lb-callout.warning > svg { color: var(--warning); }
.lb-callout.danger > svg { color: var(--danger); }

/* breadcrumbs: where this view sits (Map > Tracks > Parents). The current item carries aria-current and cuts with an
   ellipsis; the chevron turns with the page direction; hide-sm hides the trail under 760px. */
.lb-crumbs { display: flex; align-items: center; gap: .45rem; min-width: 0; font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); white-space: nowrap; }
.lb-crumbs a { color: var(--text-3); }
.lb-crumbs a:hover { color: var(--text); }
.lb-crumbs > * + *::before { content: ""; display: inline-block; width: .36rem; height: .36rem; margin-inline-end: .45rem; border: solid var(--text-3); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); vertical-align: .12em; opacity: .7; }
.lb-crumbs:dir(rtl) > * + *::before { transform: rotate(135deg); }
.lb-crumbs [aria-current] { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 760px) { .lb-crumbs.hide-sm { display: none; } }

/* pager: previous and next at the end of a lesson or section: <nav class="lb-pager"><a class="prev"><small>הקודם</small>
   <b>title</b></a><a class="next">...</a></nav>. One column on a phone. */
.lb-pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
.lb-pager a { display: grid; gap: 2px; padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--text); min-width: 0; }
.lb-pager a:hover { border-color: var(--tint); color: var(--text); text-decoration: none; }
.lb-pager small { font-family: var(--font-2); font-size: var(--fs-caption); font-weight: 600; color: var(--text-3); }
.lb-pager b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-pager .next { grid-column: 2; text-align: end; }
.lb-pager a[aria-disabled="true"] { opacity: .45; pointer-events: none; }
@media (max-width: 560px) { .lb-pager { grid-template-columns: minmax(0, 1fr); } .lb-pager .next { grid-column: auto; } }

/* row list: a list of rows that open (tasks, notes, actions). details.lb-rowitem > summary holds a marker (an lb-disc or an
   lb-check), an lb-rowitem-title (with a small line), an lb-rowitem-meta and the chevron; lb-rowitem-body lines up with the
   title. is-done strikes the title through. On a phone the meta drops under the title. */
.lb-rowlist { display: grid; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
.lb-rowlist > * + * { border-top: 1px solid var(--line); }
.lb-rowitem > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: var(--sp-3); padding: .7rem var(--sp-4); }
.lb-rowitem > summary::-webkit-details-marker { display: none; }
.lb-rowitem > summary:hover { background: var(--fill); }
.lb-rowitem > summary::after { content: ""; width: .45rem; height: .45rem; border: solid var(--text-3); border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .2s; }
.lb-rowitem:dir(rtl) > summary::after { transform: rotate(135deg); }
.lb-rowitem[open] > summary::after { transform: rotate(45deg); }
.lb-rowitem-title { display: block; min-width: 0; font-weight: 600; font-size: var(--fs-callout); }
.lb-rowitem-title small { display: block; margin-top: 1px; font-family: var(--font-2); font-weight: 500; font-size: var(--fs-footnote); color: var(--text-3); }
.lb-rowitem-meta { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); font-family: var(--font-2); font-size: var(--fs-footnote); color: var(--text-3); white-space: nowrap; }
.lb-rowitem-body { display: grid; gap: var(--sp-2); padding: 0 var(--sp-4) var(--sp-4); padding-inline-start: calc(var(--sp-4) + 2rem + var(--sp-3)); min-width: 0; }
.lb-rowitem.is-done .lb-rowitem-title { color: var(--text-3); text-decoration: line-through; }
@media (max-width: 560px) {
  .lb-rowitem > summary { grid-template-columns: auto minmax(0, 1fr) auto; row-gap: 2px; }
  .lb-rowitem-meta { grid-column: 2; grid-row: 2; }
  .lb-rowitem-body { padding-inline-start: var(--sp-4); }
}

/* popover menu: a small floating list under a button (a status menu, a page menu). Position it from the script. */
.lb-popover { position: absolute; z-index: 45; min-width: 12rem; max-width: min(20rem, calc(100vw - 32px)); padding: 4px; display: grid; gap: 1px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-3); }
.lb-popover > button, .lb-popover > a { display: flex; align-items: center; gap: var(--sp-2); padding: .45rem .7rem; border: 0; border-radius: var(--r-sm); background: none; color: var(--text); font: inherit; font-size: var(--fs-callout); text-align: start; text-decoration: none; cursor: pointer; }
.lb-popover > button:hover, .lb-popover > a:hover, .lb-popover > [aria-current="true"] { background: var(--fill); color: var(--text); text-decoration: none; }
.lb-popover > hr { margin: 4px 0; }
.lb-popover-label { padding: .35rem .7rem .15rem; font-family: var(--font-2); font-size: var(--fs-caption); font-weight: 700; color: var(--text-3); }

/* small pieces */
.lb-clamp-2, .lb-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.lb-clamp-2 { -webkit-line-clamp: 2; line-clamp: 2; }
.lb-clamp-3 { -webkit-line-clamp: 3; line-clamp: 3; }
