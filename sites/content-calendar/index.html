   everywhere to switch between them"). Source: shared/design/i18n.src.js; design.py puts it in nav.js in front of the
   project nav, which draws the switch (עב | EN) as a capsule floating at the bottom left, right of the edit button. Server side and dictionaries: tools/i18n.py, shared/i18n/README.md.
   - The choice is kept in this browser (localStorage "lb-lang"). Until it is used a page shows the language it was written
     in; once it is set, every page shows that language: the page's words are swapped in place from its dictionaries
     (the lumebook-i18n block the server adds or the build bakes in), <html> gets lang and dir, and Hebrew containers
     (dir="rtl", lang="he") turn left to right in English, English ones (lang="en") right to left in Hebrew.
   - A key is the text of one block of the page (a paragraph, a button, a cell): its text pieces in order, joined by
     U+001F, white space collapsed, every number written {0} {1} ... so "12 יוצרים" and "13 יוצרים" share one entry.
   - Never touched: fields, editable text, code, the edit button, and anything inside translate="no" or SKIP below. The
     edit button calls suspend() before it opens and resume() when it closes, so an edit never saves a translation.

  // never translated: Hebrew copy for parents (carousel slides .sty, text blocks people copy), editable text, the edit button
  const SKIP = '[translate="no"], .notranslate, [data-i18n="off"], .lb-editable, .lb-textblock, .sty, [data-lb-ui], [data-site-editor], .lb-langfab';
  const SKIP_TAGS = new Set(["script", "style", "noscript", "textarea", "input", "code", "pre", "kbd", "samp", "template", "iframe", "object", "canvas", "video", "audio", "math"]);

/* The LumeBook project nav (Yarin, 5 Nov 2026): one navigation on every internal page.
   Since 6 Nov 2026 there is no top bar and no location path (Yarin: "remove the top navbar"): the side bar runs the full
   height of the window and holds everything. Since 8 Nov 2026 it is the only list of tools (Yarin: "move everything to the
   side bar"): HQ's front page is the live numbers (#home), first in the side bar as "בית".
   - side bar on the right: the logo home to HQ and the menu button at its top, then every HQ tool by topic. The current page
     is marked in the list.
   - topics fold (Yarin, 15 Nov 2026: "i want main topics ... to expand when clicking"): each topic is a row with its icon;
     a click opens or closes its pages under it (several can be open). The topic of the page you are on starts open; the
     topics you open stay open in this browser (localStorage lb-gside-open).
   - always a closed icon rail except while hovered (Yarin, 15 Nov 2026: "always closed expect when hovering ... so it wont
     close unexpectedly"): with a mouse or trackpad the rail opens over the page, never pushing it, once the pointer rests
     on it (hover intent: it settles for one 70ms beat, or 300ms at most; a fast pass does nothing; a press opens it at
     once) and closes 420ms after the pointer leaves (back in time, nothing happens). It stays open while the pointer is
     within 28px of its edge, while a press that began in it is held, while keyboard focus is in it, and when the pointer
     leaves the window across the screen edge (it closes once the pointer comes back over the page). After a click on a
     link, Esc or a page load under the pointer it waits for the pointer to leave before it opens again. Keyboard: Tab
     into it opens it. Touch screens wider than a phone: the menu button opens it, a tap outside closes it.
   - phones (760px and narrower): the side bar is a drawer over the page, a bottom nav bar holds HQ, the first three
     topics and "עוד"; it slides away while scrolling down and comes back on the way up
   Source: shared/design/nav.src.js. design.py puts window.LB_NAV_DATA in front of it (hq-tools.json with the topic
   colours, the icons, the logo, the HQ and Vercel addresses, HQ's saved layout) and writes shared/design/nav.js.
   Builds inline it with design.head(); HQ links a synced copy. Styles: "project nav" in lumebook.css.
   Since 8 Nov 2026 its foot holds the language switch (עב | EN): window.LBI18N (i18n.src.js, in front of this
   script in nav.js) swaps the words of the page, this side bar's included; the switch itself is never translated.
   A page tells it where it is with window.LB_PAGE = { file: "<path in the project>" } (design.head() does this inside
   a lumebook.py build) or { hq: true } (HQ, which then calls LBNav.setCurrent on every view). Without it the address
   decides: the path on the project server, the address on Vercel. */
(() => {
  "use strict";
  if (window.LBNav) return;
  const D = window.LB_NAV_DATA || { topics: [], icons: {}, ui: {}, hq: {}, web_copies: {} };
  const PAGE = window.LB_PAGE || {};
  const host = location.hostname;
  const LOCALHOST = /^(localhost|127\.0\.0\.1)$/.test(host);
  const ON_SERVER = LOCALHOST && location.port === "8780";
  // where this page is open decides which version of a tool a link opens (as on HQ's cubes): the project server opens the
  // local page, the claude.ai artifact the artifact, the Vercel copy the copy or the artifact. claude.ai opens a link from
  // an artifact in a new tab and allows nothing else.
  const MODE = LOCALHOST || location.protocol === "file:" ? "local" : /\.vercel\.app$/.test(host) ? "web" : "artifact";
  const NEW_TAB = MODE === "artifact" ? ' target="_blank" rel="noopener noreferrer"' : "";
  const PHONE = window.matchMedia("(max-width: 760px)");
  const FINE = window.matchMedia("(hover: hover) and (pointer: fine)");
  const OPEN_KEY = "lb-gside-open";

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const svg = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner || ""}</svg>`;
  const ico = (name) => svg((D.icons || {})[name] || (D.icons || {}).grid);
  const ui = (name) => svg((D.ui || {})[name]);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const localUrl = (p) => (ON_SERVER ? "/" : "http://localhost:8780/") + p.split("/").map(encodeURIComponent).join("/");
  const HQ_URL = PAGE.hq ? "" : MODE === "local" ? localUrl(D.hq.local) : MODE === "web" ? D.hq.web : D.hq.artifact;
  const hqTarget = PAGE.hq || MODE !== "artifact" ? "" : NEW_TAB;

  // ---------- the layout: hq-tools.json, then Yarin's own arrangement from HQ edit mode ----------
  const toolId = (t) => t.id || (t.view ? "v:" + t.view + (t.tab ? ":" + t.tab : "") : t.local ? "l:" + t.local : t.art ? "a:" + t.art : "w:" + (t.web || t.t));
  function defaultLayout() {
    return { v: 1, removed: [], topics: (D.topics || []).map((tp) => ({ id: tp.id, label: tp.label, desc: tp.desc || "", icon: tp.icon || "grid",
      cat: Number(tp.cat) || 0, tools: (tp.tools || []).map((t) => ({ ...clone(t), id: toolId(t) })) })) };
  }
  // a saved layout wins; a tool added to hq-tools.json later still shows up (in its topic) unless Yarin deleted it (removed)
  function mergeLayout(saved) {
    const def = defaultLayout();
    if (!saved || saved.default || !Array.isArray(saved.topics)) return def;   // default: true = reset, follow hq-tools.json
    const L = { v: 1, removed: Array.isArray(saved.removed) ? saved.removed.slice() : [],
      topics: clone(saved.topics).filter((t) => t && t.id).map((t) => ({ ...t, cat: Number(t.cat) || 0, tools: (t.tools || []).filter((x) => x && x.id) })) };
    const have = new Set(L.topics.flatMap((t) => t.tools.map((x) => x.id))), gone = new Set(L.removed);
    for (const dt of def.topics) for (const tool of dt.tools) {
      if (have.has(tool.id) || gone.has(tool.id)) continue;
      let home = L.topics.find((t) => t.id === dt.id);
      if (!home) { home = { ...dt, tools: [] }; L.topics.push(home); }
      home.tools.push(tool); have.add(tool.id);
    }
    return L;
  }

  // the version a tool opens here (main) and, when there is one, the other version (alt): HQ's cubes use the same rule
  function toolLinks(t) {
    if (t.view) return { main: { href: HQ_URL + "#" + t.view, where: "ב-HQ", kind: "view" }, alt: null };
    const copy = MODE === "web" && (D.web_copies || {})[t.art];
    const v = { local: t.local && { href: localUrl(t.local), where: "מקומי", kind: "local" },
                art: t.art && { href: "https://claude.ai/artifact/" + t.art, where: "ארטיפקט", kind: "art" },
                web: t.web && { href: t.web, where: t.webLabel || "אתר", kind: "web" },
                copy: copy && { href: copy, where: "Vercel", kind: "web" } };
    const main = (MODE === "local" ? [v.local, v.art, v.web] : [v.copy, v.art, v.web, v.local]).find(Boolean);
    if (!main) return { main: { href: HQ_URL + "#home", where: "אין קישור עדיין", kind: "view" }, alt: null };
    if (MODE !== "local" && main.kind === "local") main.where = "מקומי בלבד";
    const alt = MODE === "local" ? (main.kind !== "art" ? v.art : null) : (main.kind !== "local" ? v.local : null);
    return { main, alt: alt ? { ...alt, label: alt.kind === "art" ? "גרסת ארטיפקט" : "גרסה מקומית" } : null };
  }

    en: { clear: "Clear", today: "Today", prev: "Previous month", next: "Next month", done: "Done", hour: "Hour", min: "Min", pick: "Choose a date", time: "Choose a time" },
  };

.cc-it { display: flex; align-items: center; gap: 4px; min-height: 1.6rem; padding: 0 4px; border: 0; border-radius: 6px; background: transparent; width: 100%; min-width: 0; text-align: start; color: var(--text); font-size: .875rem; cursor: pointer; }

dialog.cc-dlg { width: min(44rem, calc(100vw - 32px)); }

.cc-tl { display: grid; gap: var(--sp-2); }

.cc-cb { display: grid; gap: 6px; min-width: 0; }

.cc-ph { display: grid; gap: var(--sp-2); }

.cc-part { display: grid; gap: var(--sp-3); min-width: 0; align-content: start; }
.cc-part-h { margin: 0; display: flex; align-items: center; gap: var(--sp-2); padding-top: var(--sp-4); border-top: 1px solid var(--line);
  font-size: var(--fs-headline); font-weight: 800; }

/* the title is the field it shows: a reel's hook, a carousel's internal name */

.cc-issues .w { color: var(--warning); }

.cc-box { display: grid; gap: var(--sp-2); padding: var(--sp-3); border-radius: var(--r-md); background: var(--fill); }

.cc-ask .row { display: flex; gap: var(--sp-2); align-items: flex-end; }

/* phone and narrow windows */
@media (max-width: 860px) {
  .cc-top .lb-topbar-in { padding-inline: var(--sp-3); gap: var(--sp-2); min-height: 3.5rem; }

/* inline icons inside the calendar's own boxes (lb- components size their own) */
.cc-needs svg, .cc-flag svg, .cc-box h4 svg, .cc-notice svg, .cc-slot svg, .cc-ask svg, .cc-ph svg:not(.cc-ico svg), .cc-legend svg, .cc-dlg .lb-btn svg, .cc-top .lb-btn svg, .cc-side-foot svg { width: 1rem; height: 1rem; flex: none; }

/* on a phone the "needs me" list comes first, above the month (the page sidebar is a drawer there) */
.cc-qphone { display: none; gap: 2px; padding: var(--sp-2); border-radius: var(--r-lg); background: var(--glass-sheen), var(--glass-card); box-shadow: var(--glass-card-rim), var(--glass-card-lift); }

}

/* ---- review of 11 Nov 2026 ---- */
/* the design system's small pieces read at 14px on this page too */
.cc-app .lb-chip, .cc-dlg .lb-chip, .cc-app .lb-savestate, .cc-dlg .lb-savestate, .cc-app .lb-count, .cc-dlg .lb-count { font-size: .875rem; }
.cc-app .lb-btn.sm, .cc-dlg .lb-btn.sm { font-size: .875rem; min-height: 2.25rem; }
.cc-dlg .lb-segmented button, .cc-app .lb-segmented button { font-size: .875rem; }
.cc-note { font-size: .875rem; color: var(--text-3); }
/* room under the content for the floating edit and language capsule (and the phone tab bar) */
.cc-body { padding-bottom: calc(6rem + var(--lb-gnav-pad, 0px)); container: ccb / inline-size; }
/* a month narrowed by the drawer: each entry is its type, time and status; the title shows in the drawer */
@container ccb (max-width: 52rem) {
  .cc-cell .cc-it { grid-template-rows: auto; }
  .cc-cell .cc-it .x { display: none; }
  .cc-cell .cc-it .ab { display: none; }
  .cc-miss { max-width: 4.5rem; overflow: hidden; text-overflow: ellipsis; }
}
/* what a day misses, in words, amber */
.cc-miss { background: var(--warning-soft); color: var(--warning); }
/* the queue: six rows, then a toggle */
.cc-qmore { justify-self: start; margin-inline-start: var(--sp-1); }
/* suggested hours: one line */
.cc-hr.is-sugg > .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* grade scale with real touch targets */
.cc-grade .lb-segmented button { min-width: 2.75rem; min-height: 2.75rem; }
/* phone cells: type icons (and a bell when something waits) instead of plain dots */
.cc-dots .cc-ico { width: .875rem; height: .875rem; }
.cc-dots .need { color: var(--warning); }
/* the drawer head: 44px buttons */
.cc-dlg .lb-dialog-head .lb-btn { min-width: 2.75rem; min-height: 2.75rem; }
/* the list: channels side by side */
.cc-table .lb-row { flex-wrap: nowrap; }
/* the week: the lane of pieces without a time */
.cc-wnotime::before { content: attr(data-l); font-family: var(--font-2); font-size: .875rem; font-weight: 700; color: var(--text-3); }
/* below 1400px the page sidebar (queue, mini month, filters) opens from the top bar, so the month keeps its width */
@media (max-width: 1400px) and (min-width: 861px) {
  .cc-app { grid-template-columns: minmax(0, 1fr); }
  .cc-side { position: fixed; top: .5rem; inset-inline-start: .5rem; height: calc(100dvh - 1rem); width: min(85vw, 19rem); z-index: 60; margin: 0;
    transform: translateX(110%); visibility: hidden; transition: transform .2s ease, visibility 0s linear .2s; }
  [dir="ltr"] .cc-side { transform: translateX(-110%); }
  .cc-side.is-open { transform: none; visibility: visible; box-shadow: var(--shadow-3); transition: transform .2s ease; }
  .cc-top .lb-menu-btn { display: inline-flex; }
  #ccScrim { z-index: 55; }
}
@media (max-width: 640px) {
  .cc-hr { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .cc-hr > .h { padding-top: 0; }
  .cc-card { grid-template-columns: 3.5rem minmax(0, 1fr); }
}

/* ---- the open day fills the month's area (11 Nov 2026) ---- */
html.cc-day { overflow: hidden; }
html.cc-day .cc-body { visibility: hidden; }
dialog.cc-dlg.is-fill { position: fixed; inset: auto; margin: 0; padding: 0; max-width: none; max-height: none; z-index: 30; container: ccd / inline-size; animation: cc-fill-in var(--dur-3) var(--ease) both; }
@keyframes cc-fill-in { from { opacity: 0; transform: scale(.985); } }
.cc-dlg.is-fill .lb-dialog-body { padding-bottom: 5.5rem; }
.cc-dlg.is-fill .lb-dialog-body.is-piece > * { width: min(100%, 62rem); justify-self: center; }
@container ccd (min-width: 60rem) {
  .cc-tl { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2) var(--sp-5); align-items: start; }
  .cc-tl > .cc-hr.is-rail { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { dialog.cc-dlg.is-fill { animation: none; } }

/* ---- month, week and day on one screen (11 Nov 2026) ----
   Yarin: "view the entire month/week/day and a hint of previous/next month ... i don't want to scroll"; "day view - like in calendar
   an hour after an hour"; the legend moved into the sidebar, which folds away. */
@media (min-width: 861px) {
  .cc-app > .lb-main { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .cc-top { flex: none; }
  .cc-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-5); }
  #ccView { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .cc-month { flex: 1; min-height: 0; grid-auto-rows: unset; grid-template-rows: repeat(var(--weeks, 5), minmax(0, 1fr)); }
}
/* a month entry is one line: type, time, title, status (the cell shows what fits, then +N) */
.cc-cell .cc-it { grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-rows: auto; padding: 2px 6px; flex: none; }
.cc-cell .cc-it .x { grid-column: 3; grid-row: 1; line-height: 1.4; }
.cc-cell .cc-it .ab { display: none; }
.cc-cell .cc-it .cc-s { grid-column: 4; }
.cc-cell .cc-more { flex: none; }
/* the days of the month before and after: a faded hint */
.cc-cell.is-adj { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.cc-cell.is-adj > * { opacity: .45; }
.cc-cell.is-adj:hover > * { opacity: .8; }
.cc-n { padding-inline: 5px; border-radius: var(--r-pill); white-space: nowrap; }
/* היום rings today for a moment */
.is-flash { animation: cc-flash 1.6s var(--ease) both; }
@keyframes cc-flash { 0%, 55% { box-shadow: 0 0 0 3px var(--tint), inset 0 0 0 2px var(--tint); background-color: var(--tint-soft); } }
@media (prefers-reduced-motion: reduce) { .is-flash { animation: none; } }

/* week: hour rows share the height, entries placed by their time, overlapping ones side by side */
.cc-week { grid-template-rows: auto auto minmax(0, 1fr); flex: 1; min-height: 0; }
.cc-wh { flex-wrap: wrap; align-items: center; padding-bottom: 4px; border-radius: var(--r-sm); }
.cc-wh.is-adj { opacity: .55; }
.cc-wh .cc-miss { margin-inline-start: 0; }
.cc-wnotime { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 0 6px; }
.cc-wnotime:empty { padding: 0; }
.cc-wnotime .cc-it { width: auto; background: var(--tc-soft, var(--fill)); }
.cc-wrail { grid-auto-rows: unset; grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); }
.cc-wcol { background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% calc(100% / var(--rows)); }
.cc-wcol.is-today { box-shadow: inset 0 0 0 1.5px var(--tint); }
.cc-wcol.is-past > .cc-wb { opacity: .7; }
.cc-wb { inset-inline-end: auto; min-height: 0; padding: 2px 6px; align-content: start; }
.cc-wb.is-clash .t { color: var(--danger); }
.cc-now { position: absolute; inset-inline: 0; height: 2px; background: var(--danger); z-index: 3; pointer-events: none; }
.cc-now::before { content: ""; position: absolute; inset-inline-start: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }

/* day: one column of hours, each entry a block with its picture, type, status and title */
.cc-dayv { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.cc-dgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: 3.25rem minmax(0, 1fr); gap: 0 6px; }
.cc-dcol { min-width: 0; }
.cc-dlane { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.cc-dlane .l { font-family: var(--font-2); font-size: .875rem; font-weight: 700; color: var(--text-3); }
.cc-dlane .cc-it { width: auto; min-height: 2rem; padding: 0 8px; background: var(--tc-soft, var(--fill)); }
.cc-dlane .cc-slot { padding: .25rem .25rem .25rem .6rem; }
.cc-db { position: absolute; inset-inline-end: auto; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: var(--sp-3);
  padding: 8px 10px; border: 0; border-radius: var(--r-md); background: var(--tc-soft, var(--fill-2)); color: var(--text); font: inherit; text-align: start; cursor: pointer; overflow: hidden;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc, var(--text-3)) 30%, transparent); }
.cc-db:hover { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--tc, var(--text-3)) 60%, transparent); }
.cc-db:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.cc-db .cc-thumb { width: auto; height: 100%; max-height: 100%; aspect-ratio: 4 / 5; cursor: inherit; }
.cc-db.is-reel .cc-thumb { aspect-ratio: 9 / 16; }
.cc-db .b { display: grid; gap: 4px; align-content: start; min-width: 0; }
.cc-db .r1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .875rem; color: var(--text-2); }
.cc-db .r1 .k { font-weight: 600; }
.cc-db .tl { font-weight: 700; font-size: var(--fs-callout); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cc-db.is-clash .r1 .lb-num { color: var(--danger); }
.cc-db.is-slot { display: flex; align-items: center; gap: var(--sp-2); background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--text-3); cursor: default; font-size: .875rem; }
.cc-db.is-slot .r1 { color: var(--text-3); }
.cc-db.is-slot .lb-btn { margin-inline-start: auto; }
.cc-dayv.is-past .cc-db { opacity: .7; }
.cc-dcol .cc-empty-day { position: absolute; inset: 0; display: grid; place-items: center; }
.cc-db svg:not(.cc-ico svg):not(.cc-st svg):not(.cc-s svg):not(.cc-bellbox svg), .cc-dlane svg:not(.cc-ico svg), .cc-body .lb-btn svg { width: 1rem; height: 1rem; flex: none; }
@media (max-width: 860px) {
  .cc-wcol { height: calc(var(--rows) * 3rem); }
  .cc-db { grid-template-columns: minmax(0, 1fr); }
  .cc-db .cc-thumb { display: none; }
}

/* the legend lives in the sidebar */
.cc-side .cc-legend { flex-direction: column; align-items: flex-start; gap: 8px; padding-inline: var(--sp-2); }
.cc-side .cc-lg-miss { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; line-height: 1.4; }
.cc-side .cc-lg-miss .cc-miss { margin: 0; }
/* the sidebar folds away on a wide screen (a narrower one opens it from the top bar) */
.cc-side-btn { display: none; }
@media (min-width: 1401px) {
  .cc-top .cc-side-btn { display: inline-flex; min-width: 2.75rem; justify-content: center; }
  .cc-side-btn[aria-pressed="true"] { background: var(--fill); }
  html.cc-side-off .cc-app { grid-template-columns: minmax(0, 1fr); }
  html.cc-side-off .cc-side { display: none; }
}
.cc-db .cc-flag { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-db .cc-flag svg { vertical-align: -.15em; margin-inline-end: 4px; }

/* an empty planned slot: a red outline of a row that says what is missing (Yarin, 11 Nov 2026) */
.cc-it.cc-gap { cursor: default; padding: 0 6px; box-shadow: inset 0 0 0 1px var(--danger); color: var(--danger); background: transparent; }
.cc-it.cc-gap:hover { background: transparent; }
.cc-it.cc-gap .t { color: var(--danger); }
.cc-cell .cc-it.cc-gap .x { display: block; }
.cc-wgap { position: absolute; z-index: 1; display: flex; align-items: flex-start; gap: 4px; padding: 2px 6px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--danger); color: var(--danger); font-size: .875rem; overflow: hidden; }
.cc-wgap .t { font-family: var(--font-2); font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
.cc-wgap .x { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-gap-lg { display: inline-block; width: 1.6rem; height: .9rem; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--danger); vertical-align: middle; }

/* dragging a piece: where it will land (Yarin, 11 Nov 2026) */
.cc-wb.is-drag, .cc-db.is-drag { opacity: .4; }
.cc-dropline { position: absolute; inset-inline: 0; height: 0; border-top: 2px solid var(--tint); z-index: 4; pointer-events: none; }
.cc-dropline b { position: absolute; inset-inline-start: 4px; top: -.95rem; padding: 0 6px; border-radius: var(--r-pill); background: var(--tint-solid); color: #fff; font-family: var(--font-2); font-size: .8125rem; font-variant-numeric: tabular-nums; }
#ccPrev.is-drop, #ccNext.is-drop { box-shadow: inset 0 0 0 2px var(--tint); background: var(--tint-soft); }
.cc-mini .is-drop, .cc-wh.is-drop { box-shadow: inset 0 0 0 2px var(--tint); background: var(--tint-soft); }
/* the previous and next buttons stand in a gutter on each side of the calendar; the gutter is also where a held piece moves the view on */
.cc-stage { display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) 1.75rem; gap: var(--sp-2); min-width: 0; }
.cc-stage > #ccView { min-width: 0; }
.cc-rail { display: flex; flex-direction: column; align-items: stretch; }
/* long and thin: each button is a bar as tall as the calendar (Yarin, 11 Nov 2026: "make them long and thin like the drawing") */
.cc-rail .lb-btn { flex: 1; width: 100%; min-width: 0; min-height: 4rem; padding: 0; justify-content: center; border-radius: var(--r-lg); }
@media (min-width: 861px) { .cc-stage { flex: 1; min-height: 0; } }
@media (max-width: 640px) {
  .cc-stage { grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
  .cc-stage > #ccView { grid-column: 1 / -1; grid-row: 2; }
  .cc-rail { grid-row: 1; flex-direction: row; align-items: center; }
  .cc-rail .lb-btn { flex: none; width: 2.75rem; min-height: 2.75rem; height: 2.75rem; border-radius: 50%; }
  .cc-rail[data-dir="1"] { justify-content: flex-end; }
  .cc-rail[data-dir="-1"] { justify-content: flex-start; }
}
/* the day view has no purple outline on today (Yarin, 11 Nov 2026); the week keeps it */
.cc-dcol.is-today:not(.is-drop) { box-shadow: inset 0 0 0 1px var(--line); }

/* a bell on a block that waits for Yarin; the banner on top of the day is gone */
.cc-db:has(.cc-bellbox) { grid-template-columns: auto minmax(0, 1fr) auto; }
/* a fixed square in the middle of the block's far end, the bell filling it (Yarin, 11 Nov 2026: "fix"; the box used to grow to the
   block's height while a wider rule kept the bell at 1rem); opaque, so a pink or teal block does not tint it */
.cc-bellbox { align-self: center; display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: var(--r-sm); color: var(--warning);
  background: linear-gradient(var(--warning-soft), var(--warning-soft)), var(--surface); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warning) 35%, transparent); }
.cc-bellbox svg { width: 1.5rem; height: 1.5rem; }
/* week and day: the previous bar stands between the hours and the content (Yarin, 11 Nov 2026: "move the right arrow to the left of the time") */
@media (min-width: 641px) {
  .cc-stage:has(#ccView[data-view="day"]), .cc-stage:has(#ccView[data-view="week"]) { position: relative; grid-template-columns: minmax(0, 1fr) 1.75rem; }
  .cc-stage:has(#ccView[data-view="day"]) .cc-rail[data-dir="-1"], .cc-stage:has(#ccView[data-view="week"]) .cc-rail[data-dir="-1"] { position: absolute; top: 0; bottom: 0; inset-inline-start: calc(3.25rem + 6px); width: 1.75rem; }
  .cc-week { grid-template-columns: 3.25rem 1.75rem repeat(7, minmax(0, 1fr)); }
  .cc-dgrid { grid-template-columns: 3.25rem 1.75rem minmax(0, 1fr); }
  .cc-dlane { margin-inline-start: calc(3.25rem + 1.75rem + 12px); }
}
@media (max-width: 640px) { .cc-gut { display: none; } }

/* every block shows all its text: titles wrap, nothing is cut (Yarin, 11 Nov 2026: "make sure i always see all the text of the content box") */
.cc-wb, .cc-db { overflow: visible; }
.cc-wb .x { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; line-height: 1.3; }
.cc-db .tl { display: block; overflow: visible; -webkit-line-clamp: unset; }
.cc-db .cc-flag { white-space: normal; overflow: visible; text-overflow: clip; }
.cc-db .cc-thumb { align-self: start; height: auto; max-height: none; width: 3.25rem; }
.cc-db.is-reel .cc-thumb { width: 2.75rem; }
.cc-db .cc-thumb img, .cc-db .cc-thumb video { width: 100%; height: 100%; object-fit: cover; }
.cc-wgap { overflow: visible; height: auto; }
.cc-wgap .x { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }

/* ---- the piece panel keeps every row at its own height (11 Nov 2026) ----
   A piece taller than the window squashed the tabs to 6px: the body is a grid of fixed height, and a grid row holding a scroll box
   (lb-tabs scrolls sideways) may shrink to nothing when the content overflows. */
.cc-dlg .lb-dialog-body { grid-auto-rows: max-content; grid-template-columns: minmax(0, 1fr); }

/* ---- a reel in the panel is the reel calendar's card (Yarin, 11 Nov 2026: "add full capabilities from the reel calendar") ----
   the words on the right, the reel on the left beside them (it stays in view while the script scrolls); one column when narrow */
.cc-dlg.is-fill .lb-dialog-body.is-piece.is-reel > * { width: min(100%, 76rem); }
.cc-reel { display: grid; gap: var(--sp-4); align-items: start; }
.cc-rmain { display: grid; gap: var(--sp-3); min-width: 0; }
.cc-rside { display: grid; gap: var(--sp-2); justify-items: center; }
@container ccd (min-width: 50rem) {
  .cc-reel { grid-template-columns: minmax(0, 1fr) 17rem; }
  .cc-reel > .cc-rmain { grid-column: 1; grid-row: 1; }
  .cc-reel > .cc-rside { grid-column: 2; grid-row: 1; position: sticky; top: var(--sp-3); justify-items: stretch; }
  .cc-reel > .cc-rside .cc-video { width: 100%; }
}
.cc-rside .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.cc-rside .cc-note { text-align: center; }
.cc-rnone { display: grid; place-content: center; justify-items: center; gap: var(--sp-2); width: min(17rem, 100%); aspect-ratio: 9 / 16; padding: var(--sp-4);
  border-radius: var(--r-md); background: var(--fill); color: var(--text-3); font-size: .875rem; text-align: center; }
.cc-rnone > svg { width: 2rem; height: 2rem; }
.cc-rchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cc-rchips a.lb-chip { text-decoration: none; }
.cc-rchips svg, .cc-scr-head svg, .cc-tp svg, .cc-copy svg { width: 1rem; height: 1rem; flex: none; }
.cc-rhook { margin: 0; font-size: var(--fs-title); font-weight: 800; line-height: 1.25; white-space: pre-line; }
.cc-rsec { display: grid; gap: var(--sp-2); padding: var(--sp-3); border-radius: var(--r-lg); background: var(--glass-sheen), var(--glass-card); box-shadow: var(--glass-card-rim); }
.cc-rsec > h4, .cc-scr-head h4 { margin: 0; display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-callout); }
.cc-rsec p { margin: 0; }
.cc-scr-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.cc-scr-sum { font-family: var(--font-2); font-size: .875rem; color: var(--text-3); }
.cc-scr-sum b { color: var(--text); font-variant-numeric: tabular-nums; }
.cc-scr-sum.is-out b { color: var(--danger); }
.cc-tp { display: inline-flex; align-items: center; gap: 4px; margin-inline-start: auto; }
.cc-tp .lb-num { min-width: 1.25rem; text-align: center; font-size: .875rem; }
.cc-scr .lb-table th { position: static; }
.cc-scr .tc { width: 4.25rem; white-space: nowrap; font-family: var(--font-2); font-variant-numeric: tabular-nums; color: var(--text-3); font-size: .8125rem; }
.cc-scr .tc span { display: block; }
.cc-scr .tc .t1 { opacity: .7; }
.cc-scr .say { font-weight: 600; }
.cc-scr .see { color: var(--text-2); font-size: .875rem; width: 38%; }
.cc-scr tr.is-fixed td { color: var(--text-3); font-style: italic; }
.cc-scr td > div { white-space: pre-line; }
/* a cell edited in place: plain text until it is touched */
.cc-cell { display: block; width: 100%; min-height: 0; margin: 0; padding: 2px 4px; border: 0; border-radius: var(--r-xs); background: transparent; box-shadow: none;
  font: inherit; color: inherit; line-height: 1.5; resize: none; field-sizing: content; }
.cc-cell:hover { background: var(--fill); }
.cc-cell:focus { outline: none; background: var(--surface); box-shadow: inset 0 0 0 1px var(--tint), 0 0 0 3px var(--tint-soft); }
.cc-cell.is-hook { font-size: var(--fs-title); font-weight: 800; line-height: 1.25; }
.cc-cap { white-space: pre-line; font-size: var(--fs-callout); line-height: 1.55; }
.cc-dlg .lb-textblock { white-space: pre-line; }
/* the make sheet: the reel calendar's file tiles, drop zone and composer */
.cc-mk { display: grid; gap: var(--sp-3); }
.cc-mk .lb-composer { --lb-composer-r: var(--r-md); }
.cc-finals { display: flex; flex-wrap: wrap; gap: 6px; }
/* files dragged anywhere over an open reel: the veil says they go into this reel */
.cc-dlg .lb-drop-veil { pointer-events: none; }
.cc-ph h3 { white-space: pre-line; }   /* a reel's hook keeps its line break, as it sits on the screen */
.cc-err { color: var(--danger); }
.cc-scr-head > .is-end { margin-inline-start: auto; }
.cc-ask:has(.lb-composer) { padding: 8px; border-radius: var(--r-xl); }   /* the composer's corners nest in the card's, like lb-ask */
.cc-cap-ed { min-height: 8rem; padding: var(--sp-2) var(--sp-3); background: var(--fill); }
.cc-rsec > h4 svg, .cc-rnone .lb-btn svg, .cc-rside .lb-btn svg, .cc-mk h4 svg { width: 1rem; height: 1rem; flex: none; }

/* ---------- the story editor (story.js + story-frame.js, 19 Nov 2026) ----------
   A frame is drawn at its real size (1080 x 1920) and scaled with --k, so the preview is the export. The frame itself keeps its own
   colours (audience content); everything around it uses tokens. */
.cc-dlg.is-fill .lb-dialog-body.is-piece.is-story > * { width: min(100%, 88rem); }
.st-ed { --st-h: min(72vh, 46rem); display: grid; grid-template-columns: 6.25rem auto minmax(17rem, 1fr); gap: var(--sp-4); align-items: start; }
.st-strip { display: grid; gap: var(--sp-2); justify-items: center; align-content: start; max-height: calc(var(--st-h) + 5rem); overflow: auto; padding: 3px; }
.st-th { position: relative; padding: 3px; border-radius: .875rem; border: 1px solid transparent; background: none; cursor: pointer; }
.st-th:hover { background: var(--hover-a); }
.st-th.is-on { border-color: var(--tint); background: var(--tint-soft); }
.st-mini { display: block; width: 72px; height: 128px; position: relative; overflow: hidden; border-radius: .625rem; background: var(--fill); }
.st-mini-c { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; transform: scale(.0666667); transform-origin: 0 0; pointer-events: none; }
.st-th .n { position: absolute; bottom: 8px; inset-inline-start: 8px; font-size: .6875rem; line-height: 1.4; padding: 0 .4rem; border-radius: 999px; background: var(--ink-fill); color: var(--on-ink-fill); }
.st-th .m { position: absolute; top: 8px; inset-inline-end: 8px; font-size: .625rem; line-height: 1.4; padding: 0 .35rem; border-radius: 999px; background: var(--ink-fill); color: var(--on-ink-fill); }
.st-strip-act { display: grid; gap: 4px; width: 100%; }
.st-strip-act .lb-btn { justify-content: center; }
.st-stage { display: grid; gap: var(--sp-2); justify-items: center; min-width: 0; }
.st-bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; width: 100%; }
.st-view { position: relative; border-radius: 1.125rem; }
.st-wrap { --k: .35; position: relative; height: var(--st-h); width: calc(var(--st-h) * 9 / 16); border-radius: 1rem; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  box-shadow: 0 12px 34px rgba(var(--shade), .22), 0 0 0 1px rgba(var(--ink-line), .14); }
.st-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform: scale(var(--k)); transform-origin: 0 0; }
.st-canvas .stf-l[data-lid] { cursor: move; }
.st-canvas .stf-l.is-sel { outline: calc(3px / var(--k)) solid var(--tint); outline-offset: calc(5px / var(--k)); }
.st-canvas .stf-safe { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--danger-solid) 24%, transparent) 0 14px, color-mix(in srgb, var(--danger-solid) 8%, transparent) 14px 28px); border-color: var(--danger-solid); }
.st-hd { position: absolute; z-index: 5; width: calc(24px / var(--k)); height: calc(24px / var(--k)); transform: translate(-50%, -50%); border-radius: 50%; background: var(--surface); border: calc(3px / var(--k)) solid var(--tint); cursor: ew-resize; }
.st-hd[data-h="h"] { cursor: ns-resize; }
.st-guide { position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px dashed var(--tint); pointer-events: none; }
.st-view.is-drop { outline: 3px dashed var(--tint); outline-offset: 4px; }
.st-fnav { display: flex; align-items: center; gap: var(--sp-2); font-size: .875rem; color: var(--text-2); }
.st-props { display: grid; gap: var(--sp-3); align-content: start; min-width: 0; max-height: calc(var(--st-h) + 5rem); overflow: auto; padding: var(--sp-3); border-radius: var(--r-lg);
  background: var(--glass-sheen), var(--glass-card); box-shadow: var(--glass-card-rim); }
.st-ph { display: flex; align-items: center; gap: var(--sp-2); }
.st-ph b { font-size: var(--fs-callout); }
.st-f { display: grid; gap: 4px; font-size: .8125rem; color: var(--text-2); min-width: 0; }
.st-f > span:first-child { font-family: var(--font-2); font-weight: 700; }
.st-f small { font-weight: 400; color: var(--text-3); }
.st-f .lb-textarea, .st-f .lb-input, .st-f .lb-select { width: 100%; }
.st-num { display: grid; grid-template-columns: minmax(0, 1fr) 4.5rem; gap: var(--sp-2); align-items: center; }
.st-num input[type="range"] { width: 100%; }
.st-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.st-chk { display: inline-flex; gap: 6px; align-items: center; font-size: .875rem; color: var(--text); }
.st-sw { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.st-sw button { width: 1.75rem; height: 1.75rem; border-radius: 50%; background: var(--c); border: 0; box-shadow: inset 0 0 0 1px rgba(var(--ink-line), .25); cursor: pointer; }
.st-sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--tint); }
.st-sw input[type="color"] { width: 1.75rem; height: 1.75rem; padding: 0; border: 0; background: none; }
.st-imgpick { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.st-imgpick img, .st-fill { width: 3.5rem; height: 6.2rem; object-fit: cover; border-radius: .5rem; box-shadow: inset 0 0 0 1px rgba(var(--ink-line), .2); display: block; }
.st-layers { display: grid; gap: 2px; }
.st-layers button { display: flex; gap: var(--sp-2); align-items: baseline; text-align: start; padding: 6px 8px; border: 0; border-radius: .5rem; background: none; color: var(--text); font: inherit; font-size: .875rem; cursor: pointer; }
.st-layers button:hover { background: var(--hover-a); }
.st-layers .t { font-family: var(--font-2); font-size: .75rem; color: var(--text-3); min-width: 3rem; }
.st-more summary { cursor: pointer; font-size: .875rem; color: var(--text-2); }
.st-more[open] { display: grid; gap: var(--sp-2); }
.st-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); margin-top: var(--sp-2); }
.st-lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(3.6rem, 1fr)); gap: 6px; }
.st-lib.is-wide { grid-template-columns: 1fr; }
.st-lib button { padding: 0; border: 0; border-radius: .5rem; overflow: hidden; background: var(--fill); cursor: pointer; }
.st-lib button:hover { box-shadow: 0 0 0 2px var(--tint); }
.st-lib img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; display: block; }
.st-lib.is-wide img { aspect-ratio: auto; object-fit: contain; }
.st-up { justify-self: start; }
.st-rvs { display: grid; gap: 6px; }
.st-rv { display: grid; gap: 2px; text-align: start; padding: var(--sp-2) var(--sp-3); border: 0; border-radius: var(--r-md); background: var(--fill); color: var(--text); font: inherit; cursor: pointer; }
.st-rv:hover { background: var(--hover-a); box-shadow: inset 0 0 0 1px var(--tint); }
.st-rv.is-used { opacity: .55; }
.st-rv .h { font-size: .75rem; color: var(--text-3); display: flex; gap: var(--sp-2); }
.st-rv .h b { color: var(--text); }
.st-rv .x { font-size: .875rem; line-height: 1.45; }
.st-pngs { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.st-pngs a, .st-nopng { position: relative; display: block; width: 4.5rem; aspect-ratio: 9 / 16; border-radius: .5rem; overflow: hidden; background: var(--fill); }
.st-pngs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.st-pngs .lb-num, .st-nopng { font-size: .6875rem; }
.st-pngs a .lb-num { position: absolute; bottom: 4px; inset-inline-start: 4px; padding: 0 .35rem; border-radius: 999px; background: var(--ink-fill); color: var(--on-ink-fill); }
.st-nopng { display: grid; place-items: center; color: var(--text-3); }
.st-stk { margin: 0; padding-inline-start: 1.1rem; display: grid; gap: 4px; font-size: .875rem; }
.st-time { width: 8rem; }
.cc-flag.is-err { color: var(--danger); }
@media (max-width: 1180px) {
  .st-ed { grid-template-columns: auto minmax(0, 1fr); }
  .st-strip { grid-column: 1 / -1; grid-auto-flow: column; justify-content: start; max-height: none; overflow-x: auto; }
  .st-strip-act { grid-auto-flow: column; width: auto; align-self: center; }
}
@media (max-width: 760px) {
  .st-ed { grid-template-columns: minmax(0, 1fr); --st-h: min(70vh, calc((100vw - 3rem) * 16 / 9)); }
  .st-props { max-height: none; }
}
.st-canvas .stf-blur.is-ed { outline: calc(2px / var(--k)) dashed var(--tint); cursor: grab; }
.st-hd.is-blur { width: calc(18px / var(--k)); height: calc(18px / var(--k)); border-radius: 4px; cursor: nwse-resize; }
.st-blurs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.st-blurs .lb-chip .lb-btn { padding: 0 2px; min-height: 0; }

</style>
